name: Patch requested adjustment r42

on:
  push:
    branches:
      - fix/requested-adjustment-legacy-r42

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/requested-adjustment-legacy-r42
          fetch-depth: 0

      - name: Patch Firestore rules and regression test
        shell: python
        run: |
          from pathlib import Path

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()

          old_submit = """        && resource.data.status == 'proposed'\n        && request.resource.data.status == 'proposed'\n        && ('adminAdjustmentStatus' in resource.data)\n"""
          new_submit = """        && request.resource.data.status == resource.data.status\n        && ('adminAdjustmentStatus' in resource.data)\n"""
          if old_submit not in rules:
              raise SystemExit('participantSubmitsSessionAdjustment status gate not found')
          rules = rules.replace(old_submit, new_submit, 1)

          old_edit = """              && resource.data.status == 'proposed'\n              && request.resource.data.status == 'proposed'\n              && (\n                participantOwnsEditableLegacy(resource.data)\n                || (\n                  ('adminAdjustmentStatus' in resource.data)\n                  && resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.adminAdjustmentStatus == 'requested'\n                )\n              )\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n"""
          new_edit = """              && (\n                (\n                  resource.data.status == 'proposed'\n                  && request.resource.data.status == 'proposed'\n                  && participantOwnsEditableLegacy(resource.data)\n                )\n                || (\n                  ('adminAdjustmentStatus' in resource.data)\n                  && resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.status == resource.data.status\n                )\n              )\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n"""
          if old_edit not in rules:
              raise SystemExit('candidate requested-adjustment edit gate not found')
          rules = rules.replace(old_edit, new_edit, 1)
          rules_path.write_text(rules)

          test_path = Path('tests/e2e/requested-adjustment-permission-r39.spec.js')
          test = test_path.read_text()
          old_test = """test('requested session adjustment has a narrow participant exception', async () => {\n  const rules = fs.readFileSync('firestore.rules', 'utf8');\n  const marker = \"resource.data.adminAdjustmentStatus == 'requested'\";\n  expect(rules).toContain(marker);\n  expect(rules).toContain(\"request.resource.data.adminAdjustmentStatus == 'requested'\");\n  expect(rules).toContain(\"request.resource.data.diff(resource.data).affectedKeys().hasOnly([\");\n  expect(rules).toContain(\"'activityName', 'activityDescription', 'participation', 'materials'\");\n  expect(rules).toContain(\"'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\");\n});\n"""
          new_test = """test('requested session adjustment has a narrow participant exception', async () => {\n  const rules = fs.readFileSync('firestore.rules', 'utf8');\n  const portal = fs.readFileSync('js/portal/review-flow-r31.js', 'utf8');\n  const marker = \"resource.data.adminAdjustmentStatus == 'requested'\";\n  expect(rules).toContain(marker);\n  expect(rules).toContain(\"request.resource.data.adminAdjustmentStatus == 'requested'\");\n  expect(rules).toContain(\"request.resource.data.status == resource.data.status\");\n  expect(rules).toContain(\"resource.data.status == 'proposed'\");\n  expect(rules).toContain(\"participantOwnsEditableLegacy(resource.data)\");\n  expect(rules).toContain(\"request.resource.data.diff(resource.data).affectedKeys().hasOnly([\");\n  expect(rules).toContain(\"'activityName', 'activityDescription', 'participation', 'materials'\");\n  expect(rules).toContain(\"'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\");\n  expect(portal).toContain('window.OleiroServices.planning.updateSession(id,proposal)');\n});\n"""
          if old_test not in test:
              raise SystemExit('r39 regression test block not found')
          test_path.write_text(test.replace(old_test, new_test, 1))

          workflow = Path('.github/workflows/patch-requested-adjustment-r42.yml')
          workflow.unlink()

      - name: Run focused regression test
        run: |
          npm ci --no-audit --no-fund
          npx playwright test tests/e2e/requested-adjustment-permission-r39.spec.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/e2e/requested-adjustment-permission-r39.spec.js .github/workflows/patch-requested-adjustment-r42.yml
          git commit -m "Fix requested adjustments for legacy and shared sessions"
          git push origin HEAD:fix/requested-adjustment-legacy-r42
