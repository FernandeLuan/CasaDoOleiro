name: Apply R51 branch patch

on:
  push:
    branches: [feat/meeting-add-activity-r51]
    paths:
      - '.github/workflows/patch-r51-branch.yml'
      - 'tools/patch-r51.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meeting-add-activity-r51
          fetch-depth: 0
      - name: Apply safe patch
        run: python tools/patch-r51.py
      - name: Validate JavaScript
        run: node --check js/portal/meeting-activity-r51.js
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules portal/index.html
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Allow activity proposals while awaiting meeting"
            git push origin HEAD:feat/meeting-add-activity-r51
          fi
