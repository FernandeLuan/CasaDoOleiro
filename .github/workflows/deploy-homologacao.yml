name: Deploy homologacao

on:
  push:
    branches:
      - test/homologacao-clean-ui
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-homologacao-clean-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Build clean application
        env:
          APP_ENV: homologation
        run: node scripts/build-site.mjs site-dist

      - name: Inject Firebase web config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_key = os.environ.get('FIREBASE_API_KEY', '').strip()
          if not api_key:
              raise SystemExit('FIREBASE_API_KEY repository secret is missing.')

          config = {
              'apiKey': api_key,
              'authDomain': 'casadooleiro-35c4e.firebaseapp.com',
              'projectId': 'casadooleiro-35c4e',
              'storageBucket': 'casadooleiro-35c4e.firebasestorage.app',
              'messagingSenderId': '391973666005',
              'appId': '1:391973666005:web:5ab4e4a406b591cccc765c',
          }

          target = Path('site-dist/js/firebase/firebase-config.js')
          target.write_text(
              'window.OLEIRO_FIREBASE_CONFIG = ' + json.dumps(config, separators=(',', ':')) + ';\n',
              encoding='utf-8',
          )
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: find site-dist/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: casadooleiro-35c4e
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-homologacao@casadooleiro-35c4e.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Deploy Firebase Hosting channel
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_SITE_ID: casadooleiro-35c4e
          FIREBASE_CHANNEL_ID: homologacao-clean-ui
          HOSTING_DIR: site-dist
        run: node scripts/deploy-hosting-rest.mjs
