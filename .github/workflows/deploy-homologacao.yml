name: Deploy homologacao

on:
  push:
    branches:
      - test/homologacao-clean-ui
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-homologacao-clean-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build homologation preview
        run: node build-preview.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-homologacao@casadooleiro-35c4e.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase Hosting channel
        run: |
          npx --yes firebase-tools@latest hosting:channel:deploy homologacao-clean-ui \
            --config firebase.preview.json \
            --project casadooleiro-35c4e \
            --non-interactive
