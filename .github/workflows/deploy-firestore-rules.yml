name: Deploy Firestore rules and indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Firestore unit isolation and candidate planning permissions
        run: npx firebase emulators:exec --only auth,firestore --project demo-casadooleiro "npm run test:firestore:rules && npm run test:e2e:seed && npx playwright test tests/e2e/legacy-planning-permissions.spec.js --project=chromium"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: casadooleiro-35c4e
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-homologacao@casadooleiro-35c4e.iam.gserviceaccount.com

      - name: Deploy Firestore rules and indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project casadooleiro-35c4e --non-interactive
