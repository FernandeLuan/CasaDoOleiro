name: One-time legacy CSS consolidation

on:
  push:
    branches:
      - test/homologacao-clean-ui
    paths:
      - scripts/consolidate-legacy-css.mjs

permissions:
  contents: write

concurrency:
  group: legacy-css-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/homologacao-clean-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Consolidate legacy CSS
        run: node scripts/consolidate-legacy-css.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate architecture
        run: node scripts/check-homologation-architecture.mjs

      - name: Validate canonical build
        env:
          APP_ENV: homologation
        run: node scripts/build-site.mjs site-dist

      - name: Remove generated build
        run: rm -rf site-dist

      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A admin portal css scripts/check-homologation-architecture.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: consolidate legacy CSS rounds'
          git push origin HEAD:test/homologacao-clean-ui
