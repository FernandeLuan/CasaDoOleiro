name: Runtime Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'portal/**'
      - 'js/**'
      - 'css/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/runtime-*.md'
      - 'docs/runtime-*.json'
      - 'docs/architecture-review-*.md'
      - '.github/workflows/runtime-architecture.yml'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Inventory runtime dependencies and shared state
        run: npm run audit:runtime
      - name: Check runtime architecture contracts
        run: node --test tests/runtime-architecture.test.mjs
      - name: Check local asset integrity
        run: node --test tests/site-assets.test.mjs
