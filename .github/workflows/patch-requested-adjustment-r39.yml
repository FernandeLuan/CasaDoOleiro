name: Patch requested adjustment permission R39

on:
  push:
    branches:
      - fix/requested-adjustment-permission-r39

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/requested-adjustment-permission-r39

      - name: Apply narrow Firestore rule fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text()
          old = """              && resource.data.status == 'proposed'\n              && request.resource.data.status == 'proposed'\n              && participantOwnsEditableLegacy(resource.data)\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n                'activityName', 'activityDescription', 'participation', 'materials',\n                'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\n              ])"""
          new = """              && resource.data.status == 'proposed'\n              && request.resource.data.status == 'proposed'\n              && (\n                participantOwnsEditableLegacy(resource.data)\n                || (\n                  ('adminAdjustmentStatus' in resource.data)\n                  && resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.adminAdjustmentStatus == 'requested'\n                )\n              )\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n                'activityName', 'activityDescription', 'participation', 'materials',\n                'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\n              ])"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/e2e/requested-adjustment-permission-r39.spec.js')
          test.write_text("""import { test, expect } from '@playwright/test';\nimport fs from 'node:fs';\n\ntest('requested session adjustment has a narrow participant exception', async () => {\n  const rules = fs.readFileSync('firestore.rules', 'utf8');\n  const marker = \"resource.data.adminAdjustmentStatus == 'requested'\";\n  expect(rules).toContain(marker);\n  expect(rules).toContain(\"request.resource.data.adminAdjustmentStatus == 'requested'\");\n  expect(rules).toContain(\"request.resource.data.diff(resource.data).affectedKeys().hasOnly([\");\n  expect(rules).toContain(\"'activityName', 'activityDescription', 'participation', 'materials'\");\n  expect(rules).toContain(\"'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\");\n});\n""")

      - name: Remove one-off workflow
        run: rm .github/workflows/patch-requested-adjustment-r39.yml

      - name: Verify diff
        run: |
          git diff --check
          grep -n "adminAdjustmentStatus == 'requested'" firestore.rules

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/e2e/requested-adjustment-permission-r39.spec.js .github/workflows/patch-requested-adjustment-r39.yml
          git commit -m "Allow candidate to edit explicitly requested adjustment"
          git push origin HEAD:fix/requested-adjustment-permission-r39
