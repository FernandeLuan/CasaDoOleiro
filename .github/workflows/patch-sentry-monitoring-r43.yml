name: Patch Sentry monitoring r43

on:
  push:
    branches:
      - feat/sentry-monitoring-r43

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sentry-monitoring-r43
          fetch-depth: 0

      - name: Add privacy-safe Sentry monitoring
        shell: python
        run: |
          from pathlib import Path

          config = """window.OLEIRO_SENTRY_CONFIG = Object.freeze({
            dsn: '',
            enabled: false,
            environment: 'development',
            release: 'local-development'
          });
          """
          Path('js/shared/monitoring-config.js').write_text(config, encoding='utf-8')

          monitoring = r"""/* Production error monitoring. The public Sentry DSN is injected at deploy time. */
          (function initOleiroMonitoring(){
            const config=window.OLEIRO_SENTRY_CONFIG||{};
            const sdkUrl='https://browser.sentry-cdn.com/10.53.1/bundle.min.js';
            const criticalCodes=new Set(['permission-denied','failed-precondition','unauthenticated','unavailable','resource-exhausted','internal','deadline-exceeded','aborted','data-loss']);
            const sensitiveKey=/(email|phone|password|passwd|token|authorization|cookie|contact|secret|name|messageText)/i;
            const queue=[];
            const reported=typeof WeakSet==='function'?new WeakSet():null;
            let initialized=false;
            let loading=false;

            function codeOf(error){
              const raw=String(error?.code||'').toLowerCase();
              return raw.includes('/')?raw.split('/').pop():raw;
            }
            function cleanUrl(value){
              try{const url=new URL(String(value||''),location.href);return `${url.origin}${url.pathname}`}
              catch{return String(value||'').split('?')[0].split('#')[0]}
            }
            function scrub(value,depth=0){
              if(depth>4)return '[truncated]';
              if(value===null||value===undefined||typeof value==='boolean'||typeof value==='number')return value;
              if(typeof value==='string'){
                if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))return '[redacted-email]';
                return value.length>500?`${value.slice(0,500)}…`:value;
              }
              if(Array.isArray(value))return value.slice(0,20).map(item=>scrub(item,depth+1));
              if(typeof value==='object'){
                const out={};
                Object.entries(value).slice(0,40).forEach(([key,item])=>{out[key]=sensitiveKey.test(key)?'[redacted]':scrub(item,depth+1)});
                return out;
              }
              return String(value);
            }
            function beforeSend(event){
              if(event.user)delete event.user;
              if(event.request){
                event.request={url:cleanUrl(event.request.url||location.href)};
              }
              if(event.extra)event.extra=scrub(event.extra);
              if(event.tags)event.tags=scrub(event.tags);
              return event;
            }
            function beforeBreadcrumb(breadcrumb){
              const category=String(breadcrumb?.category||'');
              if(category.startsWith('ui.'))return null;
              const next={...breadcrumb};
              if(next.data&&typeof next.data==='object'){
                next.data=scrub(next.data);
                if(next.data.url)next.data.url=cleanUrl(next.data.url);
              }
              if(next.message)next.message=scrub(next.message);
              return next;
            }
            function baseTags(meta={}){
              const role=String(window.state?.currentSession?.user?.role||'anonymous');
              const path=location.pathname.includes('/admin/')?'admin':location.pathname.includes('/portal/')?'portal':'login';
              return {area:meta.area||path,action:meta.action||'runtime',firebaseCode:meta.firebaseCode||'',role};
            }
            function alreadyReported(error){
              if(!reported||!error||typeof error!=='object')return false;
              if(reported.has(error))return true;
              reported.add(error);return false;
            }
            function sendException(error,meta={}){
              if(!initialized||!window.Sentry?.captureException)return null;
              if(alreadyReported(error))return null;
              let eventId=null;
              window.Sentry.withScope(scope=>{
                const tags=baseTags(meta);Object.entries(tags).forEach(([key,value])=>value&&scope.setTag(key,String(value)));
                if(meta.applicationId)scope.setTag('applicationId',String(meta.applicationId));
                if(meta.sessionId)scope.setTag('sessionId',String(meta.sessionId));
                if(meta.status)scope.setTag('recordStatus',String(meta.status));
                if(meta.extra)scope.setExtras(scrub(meta.extra));
                eventId=window.Sentry.captureException(error instanceof Error?error:new Error(String(error||'Unknown error')));
              });
              return eventId;
            }
            function captureException(error,meta={}){
              if(!config.enabled||!config.dsn)return null;
              if(!initialized){queue.push({error,meta});if(queue.length>30)queue.shift();return null}
              return sendException(error,meta);
            }
            function captureServiceError(error,meta={}){
              const code=codeOf(error);
              const message=String(error?.message||'');
              const permissionMessage=/missing or insufficient permissions|permission[- ]denied/i.test(message);
              if(!criticalCodes.has(code)&&!permissionMessage)return null;
              return captureException(error,{...meta,firebaseCode:code||'permission-denied'});
            }
            function flushQueue(){
              while(queue.length){const item=queue.shift();sendException(item.error,item.meta)}
            }
            function load(){
              if(loading||initialized||!config.enabled||!config.dsn)return;
              loading=true;
              const script=document.createElement('script');
              script.src=sdkUrl;script.crossOrigin='anonymous';script.referrerPolicy='origin';
              script.onload=()=>{
                try{
                  window.Sentry.init({
                    dsn:String(config.dsn),
                    environment:String(config.environment||'production'),
                    release:String(config.release||''),
                    sendDefaultPii:false,
                    tracesSampleRate:0,
                    beforeSend,
                    beforeBreadcrumb
                  });
                  initialized=true;
                  flushQueue();
                }catch(error){console.warn('[Monitoring] Sentry init failed',error)}
              };
              script.onerror=()=>console.warn('[Monitoring] Sentry SDK unavailable');
              document.head.appendChild(script);
            }

            window.addEventListener('error',event=>{if(!initialized&&event.error)captureException(event.error,{area:'browser',action:'unhandled_error'})});
            window.addEventListener('unhandledrejection',event=>{if(!initialized)captureException(event.reason instanceof Error?event.reason:new Error(String(event.reason||'Unhandled rejection')),{area:'browser',action:'unhandled_rejection'})});

            window.OleiroMonitoring={
              captureException,
              captureServiceError,
              addBreadcrumb(message,data={}){if(initialized&&window.Sentry?.addBreadcrumb)window.Sentry.addBreadcrumb({category:'oleiro',message:String(message||''),level:'info',data:scrub(data)})},
              isEnabled(){return Boolean(config.enabled&&config.dsn)},
              sdkVersion:'10.53.1'
            };
            load();
          })();
          """
          Path('js/shared/monitoring.js').write_text(monitoring, encoding='utf-8')

          # Central service boundary: report infrastructure/security failures and rethrow unchanged.
          service_path=Path('js/services/service-core.js')
          service=service_path.read_text(encoding='utf-8')
          old="""  async function run(task,{loading=true,delay=config.loadingDelayMs}={}){\n    const execute=()=>Promise.resolve().then(()=>typeof task==='function'?task():task);\n    if(loading&&window.OleiroLoading?.run)return window.OleiroLoading.run(execute,delay);\n    return execute();\n  }\n"""
          new="""  async function run(task,{loading=true,delay=config.loadingDelayMs,monitor=null}={}){\n    const execute=()=>Promise.resolve().then(()=>typeof task==='function'?task():task).catch(error=>{\n      window.OleiroMonitoring?.captureServiceError?.(error,monitor||{area:'service',action:'firebase_operation'});\n      throw error;\n    });\n    if(loading&&window.OleiroLoading?.run)return window.OleiroLoading.run(execute,delay);\n    return execute();\n  }\n"""
          if old not in service: raise SystemExit('service-core run block not found')
          service_path.write_text(service.replace(old,new,1),encoding='utf-8')

          # Add precise context to the candidate session edit that triggered the production incident.
          planning_path=Path('js/services/planning-service.js')
          planning=planning_path.read_text(encoding='utf-8')
          old="""        return true;\n      },{loading:false});\n    }\n  };\n})();\n"""
          new="""        return true;\n      },{loading:false,monitor:{area:'planning',action:'update_session',sessionId:String(sessionId)}});\n    }\n  };\n})();\n"""
          if old not in planning: raise SystemExit('planning updateSession tail not found')
          planning_path.write_text(planning.replace(old,new,1),encoding='utf-8')

          # Load monitoring before application code on every entry point.
          html_specs=[
            ('index.html','<script src="js/shared/i18n.js','<script src="js/shared/monitoring-config.js?v=20260901-r43"></script><script src="js/shared/monitoring.js?v=20260901-r43"></script><script src="js/shared/i18n.js'),
            ('portal/index.html','<script src="../js/shared/dom.js','<script src="../js/shared/monitoring-config.js?v=20260901-r43"></script><script src="../js/shared/monitoring.js?v=20260901-r43"></script><script src="../js/shared/dom.js'),
            ('admin/index.html','<script src="../js/shared/dom.js','<script src="../js/shared/monitoring-config.js?v=20260901-r43"></script><script src="../js/shared/monitoring.js?v=20260901-r43"></script><script src="../js/shared/dom.js')
          ]
          for file,marker,replacement in html_specs:
              path=Path(file);text=path.read_text(encoding='utf-8')
              if marker not in text: raise SystemExit(f'HTML marker not found: {file}')
              path.write_text(text.replace(marker,replacement,1),encoding='utf-8')

          # Inject the public DSN only into the deploy artifact. Missing DSN leaves monitoring disabled and never blocks deploy.
          deploy_path=Path('.github/workflows/deploy-pages.yml')
          deploy=deploy_path.read_text(encoding='utf-8')
          marker='      - name: Stamp release and asset cache keys\n'
          sentry_step="""      - name: Inject Sentry monitoring config\n        env:\n          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}\n          RELEASE_SHA: ${{ github.sha }}\n        run: |\n          python - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n\n          dsn = os.environ.get('SENTRY_DSN', '').strip()\n          sha = os.environ.get('RELEASE_SHA', '').strip()\n          config = {\n              'dsn': dsn,\n              'enabled': bool(dsn),\n              'environment': 'production',\n              'release': f'casa-do-oleiro@{sha}' if sha else 'casa-do-oleiro@unknown',\n          }\n          Path('_site/js/shared/monitoring-config.js').write_text(\n              'window.OLEIRO_SENTRY_CONFIG = Object.freeze(' + json.dumps(config, separators=(',', ':')) + ');\\n',\n              encoding='utf-8',\n          )\n          if not dsn:\n              print('SENTRY_DSN not configured; monitoring remains disabled for this deploy.')\n          PY\n\n"""
          if marker not in deploy: raise SystemExit('deploy stamp marker not found')
          deploy_path.write_text(deploy.replace(marker,sentry_step+marker,1),encoding='utf-8')

          test="""import { test, expect } from '@playwright/test';\nimport fs from 'node:fs';\n\ntest('Sentry monitoring is privacy-safe and catches critical Firebase failures', async () => {\n  const monitor = fs.readFileSync('js/shared/monitoring.js', 'utf8');\n  const config = fs.readFileSync('js/shared/monitoring-config.js', 'utf8');\n  const core = fs.readFileSync('js/services/service-core.js', 'utf8');\n  const planning = fs.readFileSync('js/services/planning-service.js', 'utf8');\n  const deploy = fs.readFileSync('.github/workflows/deploy-pages.yml', 'utf8');\n  const portal = fs.readFileSync('portal/index.html', 'utf8');\n  const admin = fs.readFileSync('admin/index.html', 'utf8');\n  const login = fs.readFileSync('index.html', 'utf8');\n\n  expect(config).toContain("dsn: ''");\n  expect(monitor).toContain('sendDefaultPii:false');\n  expect(monitor).toContain("'permission-denied'");\n  expect(monitor).toContain('beforeSend');\n  expect(monitor).toContain("if(event.user)delete event.user");\n  expect(core).toContain('captureServiceError?.(error');\n  expect(planning).toContain("action:'update_session'");\n  expect(deploy).toContain('SENTRY_DSN: ${{ secrets.SENTRY_DSN }}');\n  expect(deploy).toContain("'enabled': bool(dsn)");\n  [portal,admin,login].forEach(html=>{\n    expect(html).toContain('monitoring-config.js');\n    expect(html).toContain('monitoring.js');\n  });\n  expect(`${monitor} ${config}`).not.toMatch(/https:\/\/[^\s'\"]+@o\d+\.ingest[^\s'\"]+/);\n});\n"""
          Path('tests/e2e/sentry-monitoring-r43.spec.js').write_text(test,encoding='utf-8')

          Path('.github/workflows/patch-sentry-monitoring-r43.yml').unlink()

      - name: Run focused regression
        run: |
          npm install --no-audit --no-fund
          npx playwright test tests/e2e/sentry-monitoring-r43.spec.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/shared/monitoring-config.js js/shared/monitoring.js js/services/service-core.js js/services/planning-service.js index.html portal/index.html admin/index.html .github/workflows/deploy-pages.yml tests/e2e/sentry-monitoring-r43.spec.js .github/workflows/patch-sentry-monitoring-r43.yml
          git commit -m "Add privacy-safe Sentry production monitoring"
          git push origin HEAD:feat/sentry-monitoring-r43
