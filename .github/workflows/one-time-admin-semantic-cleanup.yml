name: One-time admin semantic cleanup

on:
  push:
    branches:
      - test/homologacao-clean-ui
    paths:
      - scripts/admin-semantic-cleanup.mjs

permissions:
  contents: write

concurrency:
  group: admin-semantic-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/homologacao-clean-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply semantic cleanup
        run: node scripts/admin-semantic-cleanup.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check architecture
        run: node scripts/check-homologation-architecture.mjs

      - name: Check canonical build
        env:
          APP_ENV: homologation
        run: node scripts/build-site.mjs site-dist

      - name: Remove generated build
        run: rm -rf site-dist

      - name: Commit semantic cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin portal js tests scripts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: consolidate admin review and assistant modules'
          git push origin HEAD:test/homologacao-clean-ui
