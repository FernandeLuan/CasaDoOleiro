name: Production Clean UI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/prod-clean-ui
      - release/prod-clean-ui-canonical
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-clean-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source architecture
        run: node scripts/check-homologation-architecture.mjs
      - name: Test asset integrity
        run: node --test tests/site-assets.test.mjs
      - name: Build production-shaped artifact
        env:
          APP_ENV: production
        run: node scripts/build-site.mjs release-dist
      - name: Check production surface
        run: |
          node scripts/check-site-assets.mjs release-dist
          find release-dist/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          test -e release-dist/login.html
          test -e release-dist/admin/index.html
          test -e release-dist/portal/index.html
          test ! -e release-dist/js/demo
          test ! -e release-dist/functions
          test ! -e release-dist/firestore.rules
          test ! -e release-dist/.github
          grep -q 'data-clean-ui-admin="1"' release-dist/admin/index.html
          grep -q 'data-clean-ui-portal="1"' release-dist/portal/index.html
          grep -q 'admin-shell.js' release-dist/admin/index.html
          grep -q 'desktop-shell.js' release-dist/portal/index.html
      - name: Check source and configuration syntax
        run: |
          find js functions/tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
          node -e "for (const p of ['firebase.json','firestore.indexes.json','functions/package.json','package.json']) JSON.parse(require('fs').readFileSync(p,'utf8'))"
      - name: Preserve production data contracts
        run: bash scripts/check-real-data-contracts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-production-site
          path: release-dist/
          retention-days: 7

  e2e:
    name: e2e / ${{ matrix.project }} / ${{ matrix.shard }}-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, iphone-webkit]
        shard: [1, 2, 3, 4]
    env:
      APP_ENV: production
      E2E_SITE_ROOT: release-dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.project == 'chromium' && 'chromium' || 'webkit' }}
      - name: Build the canonical site under test
        run: |
          node scripts/build-site.mjs release-dist
          node scripts/check-site-assets.mjs release-dist
      - name: Run bounded isolated browser regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .e2e-diagnostics
          echo "Browser: ${{ matrix.project }} | shard: ${{ matrix.shard }}/4"
          echo "Commit: $GITHUB_SHA"
          echo "Emulator project: demo-casadooleiro"
          timeout --signal=TERM --kill-after=30s 16m \
            npx firebase emulators:exec --only auth,firestore --project demo-casadooleiro \
            'npm run test:e2e:seed && npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --workers=1 --retries=0' \
            2>&1 | tee .e2e-diagnostics/ci.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}-4
          path: |
            .e2e-diagnostics/
            playwright-report/
            test-results/
            firebase-debug.log
            firestore-debug.log
            ui-debug.log
          if-no-files-found: warn
          retention-days: 7
