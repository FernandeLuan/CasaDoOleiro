name: Production Clean UI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/prod-clean-ui
      - release/prod-clean-ui-canonical
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-clean-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source architecture
        run: node scripts/check-homologation-architecture.mjs
      - name: Test asset integrity
        run: node --test tests/site-assets.test.mjs
      - name: Build production-shaped artifact
        env:
          APP_ENV: production
        run: node scripts/build-site.mjs release-dist
      - name: Check production surface
        run: |
          node scripts/check-site-assets.mjs release-dist
          find release-dist/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          test -e release-dist/login.html
          test -e release-dist/admin/index.html
          test -e release-dist/portal/index.html
          test ! -e release-dist/js/demo
          test ! -e release-dist/functions
          test ! -e release-dist/firestore.rules
          test ! -e release-dist/.github
          grep -q 'data-clean-ui-admin="1"' release-dist/admin/index.html
          grep -q 'data-clean-ui-portal="1"' release-dist/portal/index.html
          grep -q 'admin-shell.js' release-dist/admin/index.html
          grep -q 'desktop-shell.js' release-dist/portal/index.html
      - name: Check source and configuration syntax
        run: |
          find js functions/tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
          node -e "for (const p of ['firebase.json','firestore.indexes.json','functions/package.json','package.json']) JSON.parse(require('fs').readFileSync(p,'utf8'))"
      - name: Preserve production data contracts
        run: bash scripts/check-real-data-contracts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-production-site
          path: release-dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run isolated browser regression
        run: npm run test:e2e:emulated
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
