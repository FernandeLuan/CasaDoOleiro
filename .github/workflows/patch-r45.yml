name: Apply R45 editable planning

on:
  push:
    branches:
      - fix/editable-submitted-planning-r45
    paths:
      - .github/workflows/patch-r45.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editable-submitted-planning-r45
          fetch-depth: 0

      - name: Apply R45 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              found=text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old[:100]}')
              text=text.replace(old,new,count)
              p.write_text(text,encoding='utf-8')

          # Firestore: submitted plans remain candidate-editable until approval;
          # couple participants share ownership of candidate-created planning records.
          replace('firestore.rules', "return app.active == true && app.status in ['pending', 'adjustments'];", "return app.active == true && app.status in ['pending', 'analysis', 'adjustments'];")
          replace('firestore.rules', "return candidateEditable(applicationId)\n        && ('planningDeadlineAt' in app)\n        && app.planningDeadlineAt != null\n        && request.time <= app.planningDeadlineAt;", "return candidateEditable(applicationId)\n        && (\n          app.status == 'analysis'\n          || (\n            ('planningDeadlineAt' in app)\n            && app.planningDeadlineAt != null\n            && request.time <= app.planningDeadlineAt\n          )\n        );")
          replace('firestore.rules', "return (!('managerCreated' in data) || data.managerCreated != true)\n        && (!('createdByUid' in data) || data.createdByUid == request.auth.uid);", "let app = applicationData(data.applicationId);\n      return (!('managerCreated' in data) || data.managerCreated != true)\n        && (\n          !('createdByUid' in data)\n          || data.createdByUid == request.auth.uid\n          || (('participantUids' in app) && app.participantUids.hasAny([data.createdByUid]))\n        );")
          replace('firestore.rules', "&& resource.data.status in ['pending', 'adjustments']\n        && ('planningDeadlineAt' in resource.data)\n        && resource.data.planningDeadlineAt != null\n        && request.time <= resource.data.planningDeadlineAt", "&& resource.data.status in ['pending', 'analysis', 'adjustments']\n        && (\n          resource.data.status == 'analysis'\n          || (\n            ('planningDeadlineAt' in resource.data)\n            && resource.data.planningDeadlineAt != null\n            && request.time <= resource.data.planningDeadlineAt\n          )\n        )")
          replace('firestore.rules', "&& candidateWindowOpen(resource.data.applicationId)\n        && request.resource.data.status == resource.data.status\n        && ('adminAdjustmentStatus' in resource.data)", "&& candidateEditable(resource.data.applicationId)\n        && request.resource.data.status == resource.data.status\n        && ('adminAdjustmentStatus' in resource.data)")
          old_session = """(\n              candidateWindowOpen(resource.data.applicationId)\n              && (\n                (\n                  resource.data.status == 'proposed'\n                  && request.resource.data.status == 'proposed'\n                  && participantOwnsEditableLegacy(resource.data)\n                )\n                || (\n                  ('adminAdjustmentStatus' in resource.data)\n                  && resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.status == resource.data.status\n                )\n              )\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n                'activityName', 'activityDescription', 'participation', 'materials',\n                'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\n              ])\n            )"""
          new_session = """(\n              (\n                (\n                  candidateWindowOpen(resource.data.applicationId)\n                  && resource.data.status == 'proposed'\n                  && request.resource.data.status == 'proposed'\n                  && participantOwnsEditableLegacy(resource.data)\n                )\n                || (\n                  candidateEditable(resource.data.applicationId)\n                  && ('adminAdjustmentStatus' in resource.data)\n                  && resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.adminAdjustmentStatus == 'requested'\n                  && request.resource.data.status == resource.data.status\n                )\n              )\n              && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n                'activityName', 'activityDescription', 'participation', 'materials',\n                'notes', 'ownerName', 'date', 'time', 'period', 'duration', 'updatedAt'\n              ])\n            )"""
          replace('firestore.rules', old_session, new_session)

          # Portal: keep submitted planning editable and show that it is already sent.
          replace('js/portal/planejamento.js', "const acts=volunteerActivities();const status=state.volunteerPlanStatus||'draft';const approved=state.volunteerMode==='approved';const editable=!approved&&(status==='draft'||status==='adjustments');", "const acts=volunteerActivities();const status=state.volunteerPlanStatus||'draft';const approved=state.volunteerMode==='approved';const editable=!approved&&['draft','submitted','adjustments'].includes(status);")
          replace('js/portal/planejamento.js', "const notice=approved?t('portal.plan.approvedNotice'):status==='submitted'?t('portal.plan.submittedNotice'):status==='adjustments'?t('portal.plan.adjustmentsNotice'):t('portal.plan.draftNotice');", "const submittedEditableNotice=typeof translateText==='function'?translateText('Planejamento enviado. A equipe já pode analisar, e você continua podendo editar, mover, adicionar ou excluir atividades até a aprovação.'):'Planejamento enviado. A equipe já pode analisar, e você continua podendo editar, mover, adicionar ou excluir atividades até a aprovação.';const notice=approved?t('portal.plan.approvedNotice'):status==='submitted'?submittedEditableNotice:status==='adjustments'?t('portal.plan.adjustmentsNotice'):t('portal.plan.draftNotice');")
          replace('js/portal/planejamento.js', "if(!approved&&!['draft','adjustments'].includes(state.volunteerPlanStatus||'draft'))return showToast(t('portal.activity.locked'));", "if(!approved&&!['draft','submitted','adjustments'].includes(state.volunteerPlanStatus||'draft'))return showToast(t('portal.activity.locked'));")
          replace('js/portal/app.js', "if(!approved&&!['draft','adjustments'].includes(state.volunteerPlanStatus||'draft'))return showToast(t('portal.activity.locked'));", "if(!approved&&!['draft','submitted','adjustments'].includes(state.volunteerPlanStatus||'draft'))return showToast(t('portal.activity.locked'));")

          # Adjustment mode no longer locks unrelated candidate-created activities.
          replace('js/portal/candidate-adjustment-r37.js', """    if(!requested&&!draft){\n      card.querySelectorAll(':scope > .activity-actions').forEach(node=>node.remove());\n      return root.innerHTML;\n    }\n""", """    if(!requested&&!draft)return root.innerHTML;\n""")
          replace('js/portal/candidate-adjustment-r37.js', """  openActivityModal=function(date=null,id=null){\n    if(id&&scopedAdjustment()&&!isDraftActivity(id))return showToast(text('portal.activity.locked'));\n    return baseOpenActivityModal(date,id);\n  };\n\n  requestDeletePlanningSession=function(activityId,date){\n    if(scopedAdjustment()&&!isDraftActivity(activityId))return showToast(text('portal.activity.locked'));\n    return baseRequestDelete(activityId,date);\n  };\n""", """  openActivityModal=function(date=null,id=null){return baseOpenActivityModal(date,id)};\n\n  requestDeletePlanningSession=function(activityId,date){return baseRequestDelete(activityId,date)};\n""")

          # Home copy and candidate cards reflect the new editable-submitted state.
          replace('js/portal/home.js', "const planMeta={submitted:[t('portal.home.planSubmitted'),'success',t('portal.home.submittedBody')],", "const submittedEditableBody=typeof translateText==='function'?translateText('Planejamento enviado. Você ainda pode ajustar as atividades enquanto a equipe analisa.'):'Planejamento enviado. Você ainda pode ajustar as atividades enquanto a equipe analisa.';const planMeta={submitted:[t('portal.home.planSubmitted'),'success',submittedEditableBody],")

          p=Path('js/portal/product-current.js'); text=p.read_text(encoding='utf-8')
          marker="  function safe(value){return encodeURIComponent(String(value??''))}\n"
          if marker not in text: raise SystemExit('product-current: safe marker missing')
          text=text.replace(marker, marker+"  const safeHtml=typeof window.escapeHtml==='function'?window.escapeHtml:(value=>String(value??'').replace(/[&<>'\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\\\"':'&quot;'}[c]||c)));\n  const safeStatusMeta=status=>typeof window.statusMeta==='function'?window.statusMeta(status):[String(status||''),''];\n",1)
          text=text.replace('escapeHtml(', 'safeHtml(')
          text=text.replace('statusMeta(s.status)[0],statusMeta(s.status)[1]', 'safeStatusMeta(s.status)[0],safeStatusMeta(s.status)[1]')
          text=text.replace("statusBadge=change?badge(t('portal.session.changeRequested'),'warning'):(s.status==='proposed'&&!approved?'':s.status==='confirmed'?'':badge(safeStatusMeta(s.status)[0],safeStatusMeta(s.status)[1]))", "statusBadge=!approved&&state.volunteerPlanStatus==='submitted'?badge(t('portal.plan.sentButton'),'info'):change?badge(t('portal.session.changeRequested'),'warning'):(s.status==='proposed'&&!approved?'':s.status==='confirmed'?'':badge(safeStatusMeta(s.status)[0],safeStatusMeta(s.status)[1]))")
          text=text.replace("a.time||raw.time||'—'", "a.time||raw.time||'N/A'")
          p.write_text(text,encoding='utf-8')

          # Translate the new copy without introducing another round-specific file.
          p=Path('js/shared/i18n-extensions.js'); text=p.read_text(encoding='utf-8')
          en="'Os horários podem ser ajustados conforme atendimentos terapêuticos e necessidades da comunidade.':'Times may be adjusted according to therapeutic appointments and community needs.'"
          es="'Os horários podem ser ajustados conforme atendimentos terapêuticos e necessidades da comunidade.':'Los horarios pueden ajustarse según las atenciones terapéuticas y las necesidades de la comunidad.'"
          if en not in text or es not in text: raise SystemExit('i18n extension anchors missing')
          text=text.replace(en, en+",'Planejamento enviado. A equipe já pode analisar, e você continua podendo editar, mover, adicionar ou excluir atividades até a aprovação.':'Plan sent. The team can review it now, and you can still edit, move, add, or delete activities until approval.','Planejamento enviado. Você ainda pode ajustar as atividades enquanto a equipe analisa.':'Plan sent. You can still adjust activities while the team reviews it.'",1)
          text=text.replace(es, es+",'Planejamento enviado. A equipe já pode analisar, e você continua podendo editar, mover, adicionar ou excluir atividades até a aprovação.':'Planificación enviada. El equipo ya puede revisarla y todavía puedes editar, mover, agregar o eliminar actividades hasta la aprobación.','Planejamento enviado. Você ainda pode ajustar as atividades enquanto a equipe analisa.':'Planificación enviada. Todavía puedes ajustar las actividades mientras el equipo la revisa.'",1)
          p.write_text(text,encoding='utf-8')

          # Monitoring: distinguish cold Firestore startup from persistent slowness and catch asset load failures.
          p=Path('js/shared/monitoring.js'); text=p.read_text(encoding='utf-8')
          text=text.replace("  const queue=[];\n", "  const queue=[];\n  const slowQuerySeen=new Map();\n  const monitoringStartedAt=Date.now();\n",1)
          old="""  function captureSlowQuery(row={}) {\n    if(!config.enabled||!config.dsn||Number(row.ms||0)<1200)return null;\n    return captureException(new Error(`Slow Firestore query: ${String(row.name||'unknown')} (${Number(row.ms)||0}ms)`),{area:'performance',action:'slow_firestore_query',extra:{query:String(row.name||''),durationMs:Number(row.ms)||0,count:Number(row.count)||0,unitId:row.unitId||'',status:row.status||''}});\n  }\n"""
          new="""  function captureSlowQuery(row={}) {\n    const durationMs=Number(row.ms)||0,name=String(row.name||'unknown');\n    if(!config.enabled||!config.dsn||durationMs<1200)return null;\n    const seen=(slowQuerySeen.get(name)||0)+1;slowQuerySeen.set(name,seen);\n    const coldStart=row.coldStart===true||(Date.now()-monitoringStartedAt<10000);\n    if(initialized&&window.Sentry?.addBreadcrumb)window.Sentry.addBreadcrumb({category:'firestore.performance',message:name,level:durationMs>=4000?'warning':'info',data:{durationMs,count:Number(row.count)||0,coldStart,seen}});\n    if(coldStart&&seen<3)return null;\n    if(durationMs<2500&&seen<2)return null;\n    return captureException(new Error(`Slow Firestore query: ${name} (${durationMs}ms)`),{area:'performance',action:'slow_firestore_query',extra:{query:name,durationMs,count:Number(row.count)||0,unitId:row.unitId||'',status:row.status||'',coldStart,seen}});\n  }\n"""
          if old not in text: raise SystemExit('monitoring slow-query block missing')
          text=text.replace(old,new,1)
          old="window.addEventListener('error',event=>{if(!initialized&&event.error)captureException(event.error,{area:'browser',action:'unhandled_error'})});"
          new="""window.addEventListener('error',event=>{const target=event.target,resource=target&&(target.src||target.href);if(resource&&!event.error){captureException(new Error(`Asset failed to load: ${cleanUrl(resource)}`),{area:'browser',action:'asset_load_failed',extra:{tag:String(target.tagName||''),resource:cleanUrl(resource)}});return}if(!initialized&&event.error)captureException(event.error,{area:'browser',action:'unhandled_error'})},true);"""
          if old not in text: raise SystemExit('monitoring error listener missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          p=Path('js/services/service-core.js'); text=p.read_text(encoding='utf-8')
          text=text.replace("const row={name:String(name||'firestore/query'),ms:Math.max(0,Date.now()-Number(started||Date.now())),count:Number(count)||0,...meta,at:new Date().toISOString()};", "const row={name:String(name||'firestore/query'),ms:Math.max(0,Date.now()-Number(started||Date.now())),count:Number(count)||0,...meta,coldStart:typeof performance!=='undefined'&&performance.now()<10000,at:new Date().toISOString()};",1)
          p.write_text(text,encoding='utf-8')

          # Add precise Sentry context to the operation used by Josias' adjustment flow.
          p=Path('js/services/planning-service.js'); text=p.read_text(encoding='utf-8')
          old="""        return true;\n      },{loading:false});\n    }\n  };\n})();\n"""
          new="""        return true;\n      },{loading:false,monitor:{area:'planning',action:'update_session',sessionId:String(sessionId)}});\n    }\n  };\n})();\n"""
          if old not in text: raise SystemExit('planning updateSession tail missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # Regression test for the new planning semantics and monitoring hardening.
          Path('tests/e2e/editable-submitted-planning-r45.spec.js').write_text("""import { test, expect } from '@playwright/test';\nimport fs from 'node:fs';\n\ntest('submitted candidate planning stays editable without opening manager-created content', async () => {\n  const rules=fs.readFileSync('firestore.rules','utf8');\n  const planning=fs.readFileSync('js/portal/planejamento.js','utf8');\n  const app=fs.readFileSync('js/portal/app.js','utf8');\n  const adjustment=fs.readFileSync('js/portal/candidate-adjustment-r37.js','utf8');\n  expect(rules).toContain("app.status in ['pending', 'analysis', 'adjustments']");\n  expect(rules).toContain("app.status == 'analysis'");\n  expect(rules).toContain("app.participantUids.hasAny([data.createdByUid])");\n  expect(rules).toContain("resource.data.adminAdjustmentStatus == 'requested'");\n  expect(rules).toContain("candidateEditable(resource.data.applicationId)");\n  expect(planning).toContain("['draft','submitted','adjustments'].includes(status)");\n  expect(planning).toContain("['draft','submitted','adjustments'].includes(state.volunteerPlanStatus||'draft')");\n  expect(app).toContain("['draft','submitted','adjustments'].includes(state.volunteerPlanStatus||'draft')");\n  expect(adjustment).not.toContain("if(id&&scopedAdjustment()&&!isDraftActivity(id))return showToast");\n  expect(rules).toContain("!('managerCreated' in data) || data.managerCreated != true");\n});\n\ntest('monitoring records asset failures and suppresses one-off cold-start query noise', async () => {\n  const monitoring=fs.readFileSync('js/shared/monitoring.js','utf8');\n  const core=fs.readFileSync('js/services/service-core.js','utf8');\n  expect(monitoring).toContain('asset_load_failed');\n  expect(monitoring).toContain('slowQuerySeen');\n  expect(monitoring).toContain('coldStart&&seen<3');\n  expect(core).toContain('performance.now()<10000');\n});\n""",encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check js/portal/app.js
          node --check js/portal/planejamento.js
          node --check js/portal/candidate-adjustment-r37.js
          node --check js/portal/home.js
          node --check js/portal/product-current.js
          node --check js/shared/monitoring.js
          node --check js/shared/i18n-extensions.js
          node --check js/services/service-core.js
          node --check js/services/planning-service.js

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused regression
        run: npx playwright test tests/e2e/editable-submitted-planning-r45.spec.js --reporter=line

      - name: Audit unreferenced static assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          refs=set()
          for html in [Path('index.html'),Path('admin/index.html'),Path('portal/index.html')]:
              text=html.read_text(encoding='utf-8')
              for value in re.findall(r'(?:src|href)="([^"?#]+)',text):
                  if value.startswith(('http://','https://','//')): continue
                  refs.add((html.parent/value).resolve())
          root=Path('.').resolve()
          js=[p.resolve() for p in Path('js').rglob('*.js')]
          css=[p.resolve() for p in Path('css').rglob('*.css')]
          orphan_js=[str(p.relative_to(root)) for p in js if p not in refs]
          orphan_css=[str(p.relative_to(root)) for p in css if p not in refs]
          print('UNREFERENCED_JS',len(orphan_js))
          for p in orphan_js: print('  ',p)
          print('UNREFERENCED_CSS',len(orphan_css))
          for p in orphan_css: print('  ',p)
          PY

      - name: Commit R45 patch
        run: |
          rm .github/workflows/patch-r45.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules js tests .github/workflows/patch-r45.yml
          git commit -m "Keep submitted candidate planning editable"
          git push origin HEAD:fix/editable-submitted-planning-r45
