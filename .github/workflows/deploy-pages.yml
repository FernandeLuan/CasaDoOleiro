name: Deploy Casa do Oleiro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate queries, monitoring and local assets
        run: node --test tests/*.test.mjs
      - name: Validate Firestore unit isolation in the emulator
        run: npx firebase emulators:exec --only firestore --project demo-casadooleiro "npm run test:firestore:rules"
      - name: Install browser regression dependencies
        run: |
          npx playwright install --with-deps chromium webkit
      - name: Validate mobile scrolling before publication
        run: npx playwright test tests/e2e/mobile-scroll.spec.js
      - name: Build canonical production application
        env:
          APP_ENV: production
        run: node scripts/build-site.mjs _site
      - name: Inject Firebase web config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          api_key = os.environ.get('FIREBASE_API_KEY', '').strip()
          if not api_key:
              raise SystemExit('FIREBASE_API_KEY repository secret is missing.')
          config = {
              'apiKey': api_key,
              'authDomain': 'casadooleiro-35c4e.firebaseapp.com',
              'projectId': 'casadooleiro-35c4e',
              'storageBucket': 'casadooleiro-35c4e.firebasestorage.app',
              'messagingSenderId': '391973666005',
              'appId': '1:391973666005:web:5ab4e4a406b591cccc765c',
          }
          Path('_site/js/firebase/firebase-config.js').write_text(
              'window.OLEIRO_FIREBASE_CONFIG = ' + json.dumps(config, separators=(',', ':')) + ';\n',
              encoding='utf-8',
          )
          PY
      - name: Inject production monitoring config
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "SENTRY_DSN repository secret is required for production releases."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          dsn = os.environ.get('SENTRY_DSN', '').strip()
          sha = os.environ.get('RELEASE_SHA', '').strip()
          config = {
              'dsn': dsn,
              'enabled': bool(dsn),
              'environment': 'production',
              'release': f'casa-do-oleiro@{sha}' if sha else 'casa-do-oleiro@unknown',
          }
          Path('_site/js/shared/monitoring-config.js').write_text(
              'window.OLEIRO_SENTRY_CONFIG = Object.freeze(' + json.dumps(config, separators=(',', ':')) + ');\n',
              encoding='utf-8',
          )
          PY
      - name: Validate production artifact
        run: |
          node scripts/check-site-assets.mjs _site
          find _site/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          test ! -e _site/js/demo
          test ! -e _site/firestore.rules
          test ! -e _site/functions
          test ! -e _site/.github
          test -e _site/login.html
          test -e _site/release.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
