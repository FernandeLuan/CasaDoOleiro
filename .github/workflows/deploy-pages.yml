name: Deploy Casa do Oleiro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Comprehensive unit, Firestore and browser tests run before merge in CI.
      - name: Build canonical production application
        env:
          APP_ENV: production
        run: node scripts/build-site.mjs _site
      - name: Inject Firebase web config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          api_key = os.environ.get('FIREBASE_API_KEY', '').strip()
          if not api_key:
              raise SystemExit('FIREBASE_API_KEY repository secret is missing.')
          config = {
              'apiKey': api_key,
              'authDomain': 'casadooleiro-35c4e.firebaseapp.com',
              'projectId': 'casadooleiro-35c4e',
              'storageBucket': 'casadooleiro-35c4e.firebasestorage.app',
              'messagingSenderId': '391973666005',
              'appId': '1:391973666005:web:5ab4e4a406b591cccc765c',
          }
          Path('_site/js/firebase/firebase-config.js').write_text(
              'window.OLEIRO_FIREBASE_CONFIG = ' + json.dumps(config, separators=(',', ':')) + ';\\n',
              encoding='utf-8',
          )
          PY
      - name: Inject production monitoring config
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "SENTRY_DSN repository secret is required for production releases."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          dsn = os.environ.get('SENTRY_DSN', '').strip()
          sha = os.environ.get('RELEASE_SHA', '').strip()
          config = {
              'dsn': dsn,
              'enabled': bool(dsn),
              'environment': 'production',
              'release': f'casa-do-oleiro@{sha}' if sha else 'casa-do-oleiro@unknown',
          }
          Path('_site/js/shared/monitoring-config.js').write_text(
              'window.OLEIRO_SENTRY_CONFIG = Object.freeze(' + json.dumps(config, separators=(',', ':')) + ');\\n',
              encoding='utf-8',
          )
          PY
      - name: Validate production artifact
        run: |
          node scripts/check-site-assets.mjs _site
          find _site/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          test ! -e _site/js/demo
          test ! -e _site/firestore.rules
          test ! -e _site/functions
          test ! -e _site/.github
          test -e _site/login.html
          test -e _site/release.json
          test -e _site/release-notes.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
