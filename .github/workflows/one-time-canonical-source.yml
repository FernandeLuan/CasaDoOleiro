name: One-time canonical source migration

on:
  push:
    branches:
      - test/homologacao-clean-ui
    paths:
      - scripts/source-runtime-migration.mjs

permissions:
  contents: write
  id-token: write

concurrency:
  group: canonical-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/homologacao-clean-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply one-time source migration
        run: node scripts/source-runtime-migration.mjs

      - name: Validate architecture
        run: node scripts/check-homologation-architecture.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit canonical source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make clean UI the canonical source runtime'
          git push origin HEAD:test/homologacao-clean-ui

      - name: Build canonical application
        env:
          APP_ENV: homologation
        run: node scripts/build-site.mjs site-dist

      - name: Inject Firebase web config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          api_key = os.environ.get('FIREBASE_API_KEY', '').strip()
          if not api_key:
              raise SystemExit('FIREBASE_API_KEY repository secret is missing.')
          config = {
              'apiKey': api_key,
              'authDomain': 'casadooleiro-35c4e.firebaseapp.com',
              'projectId': 'casadooleiro-35c4e',
              'storageBucket': 'casadooleiro-35c4e.firebasestorage.app',
              'messagingSenderId': '391973666005',
              'appId': '1:391973666005:web:5ab4e4a406b591cccc765c',
          }
          target = Path('site-dist/js/firebase/firebase-config.js')
          target.write_text('window.OLEIRO_FIREBASE_CONFIG = ' + json.dumps(config, separators=(',', ':')) + ';\n', encoding='utf-8')
          PY

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: casadooleiro-35c4e
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-homologacao@casadooleiro-35c4e.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Deploy migrated homologation
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_SITE_ID: casadooleiro-35c4e
          FIREBASE_CHANNEL_ID: homologacao-clean-ui
          HOSTING_DIR: site-dist
        run: node scripts/deploy-hosting-rest.mjs
