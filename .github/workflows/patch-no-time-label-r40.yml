name: Patch no-time label R40

on:
  push:
    branches:
      - fix/no-time-label-r40

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-time-label-r40

      - name: Replace empty-time visual fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/portal/planejamento.js')
          text = path.read_text()
          old = "escapeHtml(s.activity.time||'—')"
          new = "escapeHtml(s.activity.time||'N/A')"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one time fallback, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/e2e/no-time-label-r40.spec.js')
          test.write_text("""import { test, expect } from '@playwright/test';\nimport fs from 'node:fs';\n\ntest('activity without preferred time keeps title alignment with N/A', async () => {\n  const source = fs.readFileSync('js/portal/planejamento.js', 'utf8');\n  expect(source).toContain(\"escapeHtml(s.activity.time||'N/A')\");\n  expect(source).toContain(\" • <span data-no-i18n>\");\n  expect(source).not.toContain(\"escapeHtml(s.activity.time||'—')\");\n});\n""")

      - name: Remove one-off workflow
        run: rm .github/workflows/patch-no-time-label-r40.yml

      - name: Verify diff
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/portal/planejamento.js tests/e2e/no-time-label-r40.spec.js .github/workflows/patch-no-time-label-r40.yml
          git commit -m "Show N/A when activity has no preferred time"
          git push origin HEAD:fix/no-time-label-r40
