name: Real data regression

on:
  push:
    branches:
      - main
      - refactor/real-data-only
      - 'fix/**'
      - 'fix-*'
      - 'audit/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: real-data-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js functions/tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
      - name: Check JSON configuration
        run: node -e "for (const p of ['firebase.json','firestore.indexes.json','functions/package.json','package.json']) JSON.parse(require('fs').readFileSync(p,'utf8'))"
      - name: Check real-data source contracts
        run: bash scripts/check-real-data-contracts.sh
      - name: Check runtime architecture boundaries
        run: node --test tests/*.test.mjs
      - name: Check canonical local assets
        run: node --test tests/site-assets.test.mjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Firestore rules
        run: |
          npm ci --no-audit --no-fund
          npx firebase emulators:exec --only auth,firestore --project demo-casadooleiro "npm run test:firestore:rules && npm run test:e2e:seed && npx playwright test tests/e2e/legacy-planning-permissions.spec.js --project=chromium"
