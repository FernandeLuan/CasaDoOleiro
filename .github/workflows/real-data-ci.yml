name: Real data regression

on:
  push:
    branches:
      - refactor/real-data-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Reject prototype runtime residues
        shell: bash
        run: |
          if grep -RInE '\?dev=1|mock-data|Thomas Miller|Maria Gómez|Sophie Martin|Trocar modo do protótipo|Teste regressivo|2026-09-' index.html admin portal js; then
            echo 'Prototype residue found in runtime files.'
            exit 1
          fi
