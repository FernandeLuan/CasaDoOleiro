name: Real data regression

on:
  push:
    branches:
      - main
      - refactor/real-data-only
      - 'fix/**'
      - 'fix-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js functions/tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check JSON configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          for path in ['firebase.json', 'firestore.indexes.json', 'functions/package.json']:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          PY

      - name: Check paginated data architecture
        shell: bash
        run: |
          grep -q 'limit:10' js/admin/app.js
          grep -q 'startAfter' js/services/application-service.js
          grep -q 'candidateHasMore' js/admin/app.js
          grep -q 'Ver mais 10' js/admin/voluntariado.js
          grep -q 'getCountFromServer' js/services/application-service.js
          grep -q 'listUpcoming' js/services/application-service.js
          grep -q 'listOccupancyMonth' js/services/application-service.js
          grep -q 'processExpiredPending' js/services/application-maintenance-service.js
          grep -q 'managerOccupancy' js/admin/refactor-r18.js
          grep -q 'occupancyScreenCache' js/admin/refactor-r18.js
          grep -q 'openOccupancyDay' js/admin/refinements-r19.js
          test ! -e js/admin/occupancy-data.js
          grep -q "where('applicationId','==',appId)" js/services/planning-service.js
          grep -q "where('date','>=',String(from))" js/services/planning-service.js
          if grep -RInE 'MANAGER_APPLICATION_MAX_RECORDS|hydrateRemainingManagerCandidates' js/admin; then
            echo 'Legacy full volunteer preload is still present.'
            exit 1
          fi

      - name: Check Firestore query budget
        shell: bash
        run: |
          grep -q 'PLAN_CACHE_MS=5\*60\*1000' js/admin/refactor-r18.js
          grep -q "listSessions({applicationId:p.id,from:dates\[0\],to:dates\[dates.length-1\]})" js/admin/refactor-r18.js
          grep -q 'A consulta ampla foi bloqueada para proteger a cota do Firestore' js/services/planning-service.js
          grep -q 'recordQuery' js/services/service-core.js
          grep -q 'activity_sessions/application' js/services/planning-service.js
          grep -q 'hasSessions' js/services/planning-r22-service.js
          grep -q "firestore.limit(1)" js/services/planning-r22-service.js
          grep -q 'activity-delete-check' js/services/planning-r22-service.js
          grep -q 'getCountFromServer' js/services/planning-r22-service.js
          grep -q 'declaredEmpty' js/portal/app.js
          grep -q 'openAdminPlanningActivity' js/admin/refinements-r20.js
          grep -q 'managerUpdateSession' js/admin/refinements-r20.js
          grep -q 'manager_confirmed' js/services/planning-service.js
          grep -q 'requestAdminDeletePlanningSession' js/admin/refinements-r20.js
          grep -q "where('status','==','confirmed')" js/services/selection-flow-r25-service.js
          grep -q 'activity_sessions/operational-schedule' js/services/selection-flow-r25-service.js
          grep -q 'selection/planning-docs' js/services/selection-flow-r25-service.js
          grep -q 'A consulta ampla foi bloqueada para proteger a cota do Firestore' js/services/selection-flow-r25-service.js
          grep -q 'hydrateCandidatePlanning(p.id,{force:true})' js/admin/selection-flow-r25.js
          grep -q "where('active','==',true)" js/services/auth-service.js
          grep -q "firestore.limit(1)" js/services/auth-service.js
          grep -q 'sessionsForActivity' js/services/consistency-r15-services.js
          grep -q "where('activityId','==',actId)" js/services/consistency-r15-services.js
          grep -q '../js/services/selection-flow-r25-service.js' admin/index.html
          grep -q '../js/services/selection-flow-r25-service.js' portal/index.html
          test ! -e js/services/planning-r23-service.js
          test ! -e js/services/planning-manager-status-r25-service.js
          if grep -RInE 'planning-r23-service|planning-manager-status-r25-service|getSessionById' admin portal js; then
            echo 'Dead planning reread/status layer was reintroduced.'
            exit 1
          fi
          if grep -RInE 'usando leitura compatível|leitura compatível temporária' js/services; then
            echo 'Unsafe Firestore wide-query fallback found in services.'
            exit 1
          fi
          if grep -nA12 'async countStatus' js/services/application-service.js | grep -q 'getDocs'; then
            echo 'Broad countStatus document fallback was reintroduced.'
            exit 1
          fi
          grep -q '"fieldPath": "applicationId"' firestore.indexes.json
          grep -q '"fieldPath": "activityId"' firestore.indexes.json

      - name: Check Spark-only account administration
        shell: bash
        run: |
          test ! -e functions/index.js
          test -e functions/tools/delete-volunteer.js
          test -e functions/tools/update-volunteer-email.js
          test -e js/services/admin-access-service.js
          test -e js/admin/access-management.js
          grep -q 'firebase-admin' functions/package.json
          if grep -RInE 'firebase-functions|ensureFunctions|httpsCallable|adminUpdateVolunteerEmail|adminDeleteVolunteerApplication' firebase.json functions/package.json js/firebase js/services/admin-access-service.js js/admin/access-management.js; then
            echo 'Cloud Functions dependency was reintroduced into the Spark runtime.'
            exit 1
          fi
          grep -q 'Cloud Shell' js/admin/access-management.js
          grep -q 'sendPasswordResetEmail' js/services/admin-access-service.js
          grep -q 'firstPortalAccessAt' js/services/onboarding-service.js
          grep -q 'markFirstPortalAccess' js/services/auth-service.js
          grep -q 'participantMarksFirstAccess' firestore.rules
          grep -q '../js/services/admin-access-service.js' admin/index.html
          grep -q '../js/admin/access-management.js' admin/index.html

      - name: Check multi-unit groups
        shell: bash
        run: |
          grep -q 'groupUnitId' js/admin/app.js
          grep -q 'groupsUnitId' js/admin/app.js
          grep -q 'changeManagerGroupUnit' js/admin/app.js
          grep -q 'managerGroupUnit' js/admin/grupos.js
          grep -q 'independentes por unidade' js/admin/grupos.js
          grep -q "where('unitId','==',normalized)" js/services/group-service.js
          grep -q "required=\['A','B','C','D'\]" js/services/group-service.js
          grep -q 'groups/unit' js/services/group-service.js
          if grep -RIn "ensureDefaults('rodeio')" js/admin js/services; then
            echo 'Hard-coded Rodeio group loading was reintroduced.'
            exit 1
          fi

      - name: Check selection lifecycle
        shell: bash
        run: |
          grep -q "status:'meeting'" js/services/selection-flow-r25-service.js
          grep -q "status:'plan_approved'" js/services/selection-flow-r25-service.js
          grep -q 'scheduleSelectionMeeting' js/services/selection-flow-r25-service.js
          grep -q 'completeSelectionMeeting' js/services/selection-flow-r25-service.js
          grep -q 'finalizeSelection' js/services/selection-flow-r25-service.js
          grep -q "status:'rejected'" js/services/selection-flow-r25-service.js
          grep -q 'Aprovar candidato' js/admin/selection-flow-r25.js
          grep -q 'Não aprovar' js/admin/selection-flow-r25.js
          grep -q 'Motivo interno da não aprovação' js/admin/selection-flow-r25.js
          grep -q 'selection-flow-card' js/admin/selection-flow-r25.js
          grep -q 'Próximos compromissos' js/portal/selection-flow-r25.js
          grep -q 'Entrar na reunião' js/portal/selection-flow-r25.js
          grep -q 'candidateEditable' firestore.rules
          grep -q 'managerCreated' firestore.rules
          grep -q '"status"' firestore.indexes.json
          grep -q '../js/admin/selection-flow-r25.js' admin/index.html
          grep -q '../js/portal/selection-flow-r25.js' portal/index.html

      - name: Check post-approval proposal workflow
        shell: bash
        run: |
          grep -q 'postApprovalProposal' js/services/planning-service.js
          grep -q 'reviewPostApprovalProposal' js/services/planning-service.js
          grep -q 'reviewStatus.*analysis' js/services/planning-service.js
          grep -q 'Nova proposta de atividade' js/portal/app.js
          grep -q 'Aguardando análise' js/portal/post-approval.js
          grep -q 'Reajustar' js/portal/post-approval.js
          grep -q 'Nova atividade' js/admin/post-approval.js
          grep -q 'Aprovar' js/admin/post-approval.js
          grep -q 'Recusar' js/admin/post-approval.js
          grep -q 'createsApprovedProposal' firestore.rules
          grep -q 'updatesApprovedProposal' firestore.rules
          grep -q '../js/portal/post-approval.js' portal/index.html
          grep -q '../js/admin/post-approval.js' admin/index.html

      - name: Check current UX safeguards
        shell: bash
        run: |
          grep -q 'Sem conexão' js/services/auth-guard.js
          grep -q 'offline-action' css/round12.css
          grep -q 'unit-admin-card' css/round12.css
          grep -q 'volunteer-change-pending' js/portal/round12-ui.js
          grep -q 'Aprovar mudança' js/admin/round12-ui.js
          grep -q 'Reiniciar planejamento' js/admin/round7-ui.js
          grep -q 'Limpar planejamento' js/admin/refinements-r23.js
          grep -q 'candidateSubmitted=\[' js/admin/refinements-r23.js
          grep -q "\['analysis','adjustments'\]" js/admin/refinements-r23.js
          grep -q 'admin-review-actions-r24' js/admin/refinements-r23.js
          grep -q 'btn-plan-clear-warning' js/admin/refinements-r23.js
          grep -q 'day-initial-analysis' js/admin/refinements-r23.js
          grep -q 'Em análise' js/admin/refinements-r23.js
          grep -q 'aria-busy' js/portal/refinements-r23.js
          grep -q 'Reenviando' js/portal/refinements-r23.js
          grep -q 'Enviando' js/portal/refinements-r23.js
          grep -q 'deleteSession(session.id' js/portal/selection-flow-r25.js
          grep -q 'applications.update(application.id' js/portal/selection-flow-r25.js
          grep -q 'Digite para buscar o país' js/admin/candidate-form.js
          grep -q 'overscroll-behavior-y:none' css/round6.css
          grep -q 'participantGenders' js/services/onboarding-service.js
          grep -q 'registrationLink' js/services/onboarding-service.js
          grep -q 'review-day-warning' js/admin/refinements-r19.js
          grep -q 'Voltar ao calendário' js/admin/refinements-r19.js
          grep -q 'home-unit-support-link' js/portal/refinements-r20.js
          grep -q 'managerCreated' js/portal/refinements-r20.js
          grep -q 'Adicione uma atividade para enviar' js/portal/refinements-r20.js
          grep -q 'participantMayResetEmptyAdjustment' firestore.rules
          grep -q '../js/shared/i18n-r25.js' admin/index.html
          grep -q '../js/shared/i18n-r25.js' portal/index.html
          grep -q 'format-detection' admin/index.html
          grep -q 'format-detection' portal/index.html

      - name: Reject prototype runtime residues
        shell: bash
        run: |
          test ! -e inactive.html
          test ! -e js/shared/notifications.js
          test ! -e js/services/attention-service.js
          test ! -e js/shared/mock-data.js
          if grep -RInE 'inactive\.html|notifications\.js|attention-service\.js|openNotifications\(' index.html admin portal js; then
            echo 'Removed route/notification residue found.'
            exit 1
          fi
          if grep -RIn 'groupPreference' admin portal js firestore.rules; then
            echo 'Undeployable candidate group preference residue found.'
            exit 1
          fi
          if grep -RInE '\?dev=1|URLSearchParams\([^)]*\).*dev|chooseDevRole|devPanel|syncPrototype|Thomas Miller|Maria Gómez|Sophie Martin|Teste regressivo|2026-09-' index.html admin portal js --exclude='i18n.js'; then
            echo 'Prototype runtime residue found.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Firestore rules
        shell: bash
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-casadooleiro "echo Firestore-rules-ok"
