name: Real data regression

on:
  push:
    branches:
      - main
      - refactor/real-data-only
      - 'fix/**'
      - 'fix-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check legacy UI integrations
        shell: bash
        run: |
          grep -q 'css/round3.css' index.html
          grep -q '../css/round3.css' admin/index.html
          grep -q '../css/round3.css' portal/index.html
          grep -q 'js/login-round3.js' index.html
          grep -q '../js/admin/round3-ui.js' admin/index.html
          grep -q '../js/portal/round3-ui.js' portal/index.html
          grep -q '../js/admin/round4-ui.js' admin/index.html
          grep -q '../js/portal/round4-ui.js' portal/index.html
          grep -q '../js/admin/round5-ui.js' admin/index.html
          grep -q '../js/admin/round5-refresh.js' admin/index.html
          grep -q '../js/portal/round5-ui.js' portal/index.html
          grep -q '../js/admin/round6-ui.js' admin/index.html
          grep -q '../js/portal/round6-ui.js' portal/index.html
          grep -q '../js/admin/round7-ui.js' admin/index.html
          grep -q '../js/portal/round7-ui.js' portal/index.html
          grep -q '../js/shared/round7-ui.js' admin/index.html
          grep -q '../js/shared/round7-ui.js' portal/index.html

      - name: Check consolidated services
        shell: bash
        run: |
          test ! -e js/shared/round3-services.js
          test ! -e js/shared/round5-services.js
          test ! -e js/shared/round6-services.js
          test ! -e js/shared/round7-services.js
          if grep -RInE 'round(3|5|6|7)-services\.js' admin portal index.html; then
            echo 'Legacy service patch layer is still loaded.'
            exit 1
          fi
          grep -q 'const activityCache=new Map' js/services/planning-service.js
          grep -q 'O candidato não atualiza o documento applications' js/services/planning-service.js
          if grep -q "firestore.doc(context.db,'applications'" js/services/planning-service.js; then
            echo 'Planning service must not write application documents from candidate operations.'
            exit 1
          fi
          grep -q 'const memory=new Map' js/services/group-service.js
          grep -q 'resetPlanning' js/services/application-service.js
          grep -q 'sessionCount:sessions.length,activityCount' js/services/application-service.js

      - name: Check current UX fixes
        shell: bash
        run: |
          grep -q 'Solicitar ajuste neste dia' js/admin/round6-ui.js
          grep -q 'stay-support-link' js/portal/round4-ui.js
          grep -q 'planning-note-button' js/admin/round5-ui.js
          grep -q 'pending-grid-two' js/admin/round5-ui.js
          grep -q 'Suporte pelo WhatsApp' js/portal/round5-ui.js
          grep -q 'Grupo definido pela Casa' js/portal/round6-ui.js
          grep -q "state.volunteerPlanStatus!=='adjustments'" js/portal/round6-ui.js
          grep -q 'modal-back-button' js/admin/round6-ui.js
          grep -q 'overscroll-behavior-y:none' css/round6.css
          grep -q 'format-detection' admin/index.html
          grep -q 'format-detection' portal/index.html
          grep -q 'Carregando atividades' js/portal/round7-ui.js
          grep -q 'stay-date-editor-native' js/admin/round7-ui.js
          grep -q 'stay-date-input-native' css/round7.css
          grep -q 'saveStayDatesWithFeedback' js/admin/round7-ui.js
          grep -q 'Reiniciar planejamento' js/admin/round7-ui.js
          grep -q "pending:\['Em preparação'" js/shared/round7-ui.js
          grep -q 'x-apple-data-detectors' css/round7.css
          if grep -RInE 'stay-date-(editor|field|input|native)-v(2|3)|syncStayDateEditorV3|syncStayDateEditorBounds' js/admin css; then
            echo 'Obsolete stay-date editor implementation found.'
            exit 1
          fi

      - name: Reject removed features and prototype residues
        shell: bash
        run: |
          test ! -e inactive.html
          test ! -e js/shared/notifications.js
          test ! -e js/services/attention-service.js
          test ! -e js/shared/mock-data.js
          if grep -RInE 'inactive\.html|notifications\.js|attention-service\.js|openNotifications\(' index.html admin portal js; then
            echo 'Removed route/notification residue found.'
            exit 1
          fi
          if grep -RIn 'groupPreference' admin portal js firestore.rules; then
            echo 'Undeployable candidate group preference residue found.'
            exit 1
          fi
          if grep -RInE '\?dev=1|URLSearchParams\([^)]*\).*dev|chooseDevRole|devPanel|syncPrototype|Thomas Miller|Maria Gómez|Sophie Martin|Teste regressivo|2026-09-' index.html admin portal js --exclude='i18n.js'; then
            echo 'Prototype runtime residue found.'
            exit 1
          fi
          if grep -RInE 'oleiro-candidate-lifecycle|oleiro-dismissed-notifications|oleiro-volunteer-mode|oleiro-volunteer-plan-status' index.html admin portal js; then
            echo 'Prototype browser persistence found.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Firestore rules
        shell: bash
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-casadooleiro "echo Firestore-rules-ok"
