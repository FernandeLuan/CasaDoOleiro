<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">

<link rel="manifest" href="manifest.webmanifest"></head><body data-root="index.html"><main class="login-shell"><section class="login-card"><div class="login-brand"><div class="login-logo"><i class="fa-solid fa-seedling"></i></div><h1>Casa do Oleiro</h1><p>Portal de gestão e planejamento do programa de voluntariado.</p></div><div class="form-grid"><div class="field"><label for="email">E-mail</label><input id="email" class="input" type="email" placeholder="seu@email.com" autocomplete="email"></div><div class="field"><label for="password">Senha</label><input id="password" class="input" type="password" placeholder="••••••••" autocomplete="current-password"></div><button class="btn btn-primary btn-block" onclick="prototypeLogin()">Entrar</button><div id="loginMessage" class="notice" hidden></div></div><div class="prototype-box"><strong>Modo protótipo</strong><p>Atalhos temporários para validar cada experiência antes do backend.</p><div class="demo-actions" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button onclick="choosePrototype('manager')">Gestor</button><button onclick="choosePrototype('volunteer','candidate')">Candidato</button><button onclick="choosePrototype('volunteer','approved')">Voluntário</button><button onclick="choosePrototype('inactive')">Perfil inativo</button></div></div></section></main><script src="js/login.js"></script></body></html>
