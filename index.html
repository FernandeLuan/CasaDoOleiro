<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#315f48">
<title>Casa do Oleiro • Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>:root {
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #edf2ec;
  --text: #1f2b24;
  --muted: #6f7b73;
  --primary: #315f48;
  --primary-2: #47775f;
  --primary-soft: #e2ede5;
  --accent: #b78750;
  --success: #2d7d4f;
  --warning: #a46f14;
  --danger: #a74343;
  --info: #3f6f91;
  --border: rgba(36, 63, 49, .12);
  --shadow: 0 8px 28px rgba(35, 52, 43, .08);
  --radius: 18px;
  --header: rgba(245,244,239,.94);
}
:root.dark {
  --bg: #111713;
  --surface: #18211b;
  --surface-2: #202c24;
  --text: #f3f6f3;
  --muted: #a7b4aa;
  --primary: #7fb394;
  --primary-2: #9ac7aa;
  --primary-soft: #203329;
  --accent: #d6a26c;
  --success: #76c793;
  --warning: #e2b85e;
  --danger: #e27f7f;
  --info: #83b7da;
  --border: rgba(255,255,255,.09);
  --shadow: 0 8px 28px rgba(0,0,0,.25);
  --header: rgba(17,23,19,.94);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text)}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:1080px;margin:0 auto;min-height:100vh}
.app-header{position:sticky;top:0;z-index:30;background:var(--header);backdrop-filter:blur(15px);padding:14px 18px 12px;border-bottom:1px solid var(--border)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--primary),#234936);display:grid;place-items:center;color:white;box-shadow:var(--shadow)}
.brand-copy{min-width:0}.brand-copy strong{display:block;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy span{font-size:.72rem;color:var(--muted)}
.icon-btn{width:40px;height:40px;border:none;border-radius:13px;background:var(--surface);color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.04)}
.page{padding:18px 16px 24px}.section{margin-bottom:22px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{font-size:1rem}.section-head p{font-size:.72rem;color:var(--muted)}
.eyebrow{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700}
.hero{background:linear-gradient(145deg,var(--primary),#234936);color:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.hero .muted{color:rgba(255,255,255,.78)}.hero h1{font-size:1.35rem;margin:4px 0 6px}.hero p{font-size:.78rem;line-height:1.5}.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:none;border-radius:13px;padding:11px 14px;font-size:.76rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}.btn-primary{background:var(--primary);color:white}.btn-light{background:white;color:#244b38}.btn-soft{background:var(--primary-soft);color:var(--primary)}.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-danger{background:#f8e9e9;color:var(--danger)}.btn-block{width:100%}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}.metric{min-height:104px;display:flex;flex-direction:column;justify-content:space-between}.metric-icon{width:34px;height:34px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}.metric strong{font-size:1.35rem}.metric span{font-size:.7rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}.list-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 3px 16px rgba(0,0,0,.035)}.list-item.clickable:hover{border-color:rgba(49,95,72,.35)}.time-box{width:52px;flex:0 0 52px;border-radius:12px;background:var(--surface-2);padding:8px 4px;text-align:center}.time-box strong{font-size:.77rem}.time-box span{font-size:.6rem;color:var(--muted)}.item-main{min-width:0;flex:1}.item-main h3{font-size:.82rem;margin-bottom:3px}.item-main p{font-size:.68rem;color:var(--muted);line-height:1.45}.item-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:.61rem;font-weight:600;background:var(--surface-2);color:var(--muted)}.badge.success{background:#e4f2e8;color:var(--success)}.badge.warning{background:#fff2d7;color:var(--warning)}.badge.danger{background:#f9e5e5;color:var(--danger)}.badge.info{background:#e5f0f7;color:var(--info)}.badge.primary{background:var(--primary-soft);color:var(--primary)}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tab{white-space:nowrap;border:none;border-radius:999px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);font-size:.68rem;color:var(--muted)}.tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.dark .bottom-nav{background:rgba(24,33,27,.96)}.nav-btn{border:none;background:transparent;color:var(--muted);font-size:.59rem;padding:5px 2px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav-btn i{font-size:1.05rem}.nav-btn.active{color:var(--primary);font-weight:700}
.notice{border-radius:15px;padding:12px 13px;background:var(--primary-soft);color:var(--primary);display:flex;gap:10px;align-items:flex-start;font-size:.7rem;line-height:1.5}.notice.warning{background:#fff4dd;color:var(--warning)}.notice.danger{background:#fae9e9;color:var(--danger)}
.search-row{display:flex;gap:8px;margin-bottom:12px}.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;padding:11px 12px;font-size:.72rem;outline:none}.textarea{min-height:90px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--primary)}.form-grid{display:grid;gap:12px}.field label{display:block;font-size:.68rem;font-weight:600;margin-bottom:6px}.field small{display:block;font-size:.6rem;color:var(--muted);margin-top:5px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calendar-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.date-chip{min-width:58px;border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:9px 5px;text-align:center;color:var(--text)}.date-chip span{display:block;font-size:.57rem;color:var(--muted);text-transform:uppercase}.date-chip strong{display:block;font-size:.95rem;margin:2px}.date-chip.active{background:var(--primary);color:white}.date-chip.active span{color:rgba(255,255,255,.78)}.date-chip.locked{opacity:.55}
.day-block{margin-bottom:14px}.day-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.day-title h3{font-size:.78rem}.day-title span{font-size:.63rem;color:var(--muted)}
.activity-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px;margin-bottom:8px;position:relative}.activity-card h4{font-size:.77rem;margin-bottom:3px}.activity-card p{font-size:.65rem;color:var(--muted)}.activity-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.activity-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.activity-actions .btn{padding:7px 9px;min-height:32px;font-size:.62rem}
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:14px}.person-top{display:flex;justify-content:space-between;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:0 0 42px}.person-info{flex:1}.person-info h3{font-size:.8rem}.person-info p{font-size:.65rem;color:var(--muted)}
.empty{padding:22px 14px;text-align:center;border:1px dashed var(--border);border-radius:16px;color:var(--muted);font-size:.7rem}.empty i{display:block;font-size:1.4rem;margin-bottom:8px;color:var(--primary)}
.modal-backdrop{position:fixed;z-index:80;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:620px;background:var(--surface);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:16px}.modal-head h2{font-size:1rem}.modal-head p{font-size:.66rem;color:var(--muted)}.modal-close{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:11px;color:var(--text)}
.segment{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:12px}.segment button{border:none;background:transparent;border-radius:10px;padding:8px;font-size:.66rem;color:var(--muted)}.segment button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check-card{border:1px solid var(--border);border-radius:12px;padding:10px;font-size:.68rem;display:flex;gap:8px;align-items:center;background:var(--surface)}.check-card input{accent-color:var(--primary)}
.info-accordion details{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:0 13px;margin-bottom:8px}.info-accordion summary{list-style:none;padding:13px 0;font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}.info-accordion details p{font-size:.67rem;line-height:1.6;color:var(--muted);padding:0 0 13px}.info-accordion summary::-webkit-details-marker{display:none}
.status-line{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.success{background:var(--success)}.dot.warning{background:var(--warning)}.dot.danger{background:var(--danger)}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat-pill{background:var(--surface-2);padding:7px 9px;border-radius:11px;font-size:.64rem;color:var(--muted)}
.toast{position:fixed;z-index:120;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#17251c;color:white;padding:10px 14px;border-radius:12px;font-size:.7rem;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.login-brand{text-align:center;margin-bottom:20px}.login-logo{width:66px;height:66px;border-radius:22px;margin:0 auto 12px;background:linear-gradient(145deg,var(--primary),#234936);color:white;display:grid;place-items:center;font-size:1.6rem}.login-brand h1{font-size:1.2rem}.login-brand p{font-size:.68rem;color:var(--muted);margin-top:5px;line-height:1.5}.prototype-box{margin-top:16px;padding:12px;background:var(--surface-2);border-radius:15px}.prototype-box strong{font-size:.68rem}.prototype-box p{font-size:.6rem;color:var(--muted);margin:3px 0 9px}.demo-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.demo-actions button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 5px;font-size:.6rem;color:var(--text)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-link{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:15px;padding:13px;display:flex;align-items:center;gap:11px;text-align:left}.menu-link i:first-child{width:24px;color:var(--primary)}.menu-link span{flex:1;font-size:.73rem}.menu-link small{display:block;color:var(--muted);font-size:.59rem;margin-top:2px}
@media(min-width:760px){body{padding-bottom:20px}.page{padding:24px}.bottom-nav{left:50%;right:auto;width:620px;transform:translateX(-50%);border:1px solid var(--border);border-radius:20px;bottom:14px;box-shadow:var(--shadow)}.grid-md-4{grid-template-columns:repeat(4,1fr)}.modal-backdrop{align-items:center}.modal{border-radius:24px;max-height:88vh}.hero{padding:24px}.hero h1{font-size:1.6rem}.field-row.three{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast" aria-live="polite"></div><div id="modalRoot"></div>
<script>const app = document.getElementById('app');
const modalRoot = document.getElementById('modalRoot');
const toastEl = document.getElementById('toast');

const state = {
  role: localStorage.getItem('oleiro-role') || null,
  managerPage: 'home',
  volunteerPage: 'home',
  volunteerMode: localStorage.getItem('oleiro-volunteer-mode') || 'candidate',
  candidateTab: 'candidates',
  candidateFilter: 'all',
  planView: 'agenda',
  selectedDate: '2026-09-08',
  theme: localStorage.getItem('oleiro-theme') || 'light',
  candidates: [
    {id:1,name:'Thomas Miller',country:'Alemanha',email:'thomas@email.com',phone:'+49 151 000000',unit:'Rodeio',from:'2026-09-03',to:'2026-09-18',status:'analysis',sessions:9,activities:4,submitted:'Hoje, 14:20'},
    {id:2,name:'Maria Gómez',country:'Argentina',email:'maria@email.com',phone:'+54 9 11 0000',unit:'Rodeio',from:'2026-09-10',to:'2026-09-25',status:'adjustments',sessions:6,activities:3,submitted:'Ontem'},
    {id:3,name:'Daniel Costa',country:'Brasil',email:'daniel@email.com',phone:'+55 47 99999-0000',unit:'Rodeio',from:'2026-10-02',to:'2026-10-17',status:'pending',sessions:0,activities:0,submitted:'—'},
    {id:4,name:'Sophie Martin',country:'França',email:'sophie@email.com',phone:'+33 6 0000',unit:'Rodeio',from:'2026-08-18',to:'2026-09-02',status:'approved',sessions:8,activities:3,submitted:'18/08'},
    {id:5,name:'Lucas García',country:'Espanha',email:'lucas@email.com',phone:'+34 600 000',unit:'Rodeio',from:'2026-08-20',to:'2026-09-05',status:'approved',sessions:7,activities:4,submitted:'17/08'},
    {id:6,name:'Alex Brown',country:'Canadá',email:'alex@email.com',phone:'+1 416 000',unit:'Rodeio',from:'2026-09-05',to:'2026-09-20',status:'rejected',sessions:4,activities:2,submitted:'20/08'}
  ],
  groups: [
    {id:'A',capacity:5,note:'Grupo operacional 1'},
    {id:'B',capacity:5,note:'Grupo operacional 2'},
    {id:'C',capacity:5,note:'Grupo operacional 3'},
    {id:'D',capacity:5,note:'Grupo operacional 4'}
  ],
  activities: [
    {id:1,name:'Conversação em inglês',description:'Conversas básicas sobre situações do cotidiano.',duration:60,participation:'Até 10',materials:'Quadro e canetas',notes:'Nível iniciante',period:'Tarde',time:'15:15',dates:['2026-09-08','2026-09-10','2026-09-15']},
    {id:2,name:'Yoga e alongamento',description:'Alongamentos leves e exercícios básicos de mobilidade.',duration:60,participation:'Livre',materials:'Tapetes, se disponíveis',notes:'Pode ser adaptado.',period:'Tarde',time:'15:15',dates:['2026-09-07','2026-09-14']},
    {id:3,name:'Futebol',description:'Atividade esportiva recreativa.',duration:90,participation:'Livre',materials:'Bola',notes:'',period:'Tarde',time:'13:45',dates:['2026-09-09','2026-09-16']},
    {id:4,name:'Oficina de fotografia',description:'Fotografia básica utilizando celular.',duration:120,participation:'Até 5',materials:'Celulares',notes:'',period:'Manhã',time:'09:00',dates:['2026-09-11']}
  ],
  sessionStatus: {
    '1-2026-09-08':'confirmed','1-2026-09-10':'change','1-2026-09-15':'confirmed',
    '2-2026-09-07':'confirmed','2-2026-09-14':'confirmed',
    '3-2026-09-09':'proposed','3-2026-09-16':'proposed',
    '4-2026-09-11':'conflict'
  },
  sessionGroups: {'1-2026-09-08':'C','2-2026-09-07':'A+B','3-2026-09-09':'Livre'},
  notifications:[
    {id:1,title:'Cronograma atualizado',text:'Yoga foi movida de 10/09 às 15:15 para 11/09 às 13:45.',unread:true},
    {id:2,title:'Alteração aguardando confirmação',text:'Thomas alterou uma sessão já confirmada.',unread:true}
  ]
};

document.documentElement.classList.toggle('dark', state.theme === 'dark');

function fmtDate(iso, short=false){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('pt-BR', short?{day:'2-digit',month:'2-digit'}:{day:'2-digit',month:'short'}).format(d).replace('.','');
}
function dayName(iso){ return new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(new Date(iso+'T12:00:00')).replace('.','').toUpperCase(); }
function statusMeta(s){
  return {
    pending:['Planejamento pendente','warning'], analysis:['Em análise','info'], adjustments:['Ajustes solicitados','warning'], approved:['Aprovado','success'], rejected:['Rejeitado','danger'],
    proposed:['Proposta','warning'], confirmed:['Confirmada','success'], change:['Alteração pendente','warning'], conflict:['Conflito','danger']
  }[s] || [s,''];
}
function badge(label,type=''){return `<span class="badge ${type}">${label}</span>`}
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
function setRole(role, mode){state.role=role;if(mode)state.volunteerMode=mode;localStorage.setItem('oleiro-role',role);localStorage.setItem('oleiro-volunteer-mode',state.volunteerMode);render()}
function logout(){state.role=null;localStorage.removeItem('oleiro-role');render()}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('oleiro-theme',state.theme);document.documentElement.classList.toggle('dark',state.theme==='dark');render()}

function render(){
  if(!state.role) return renderLogin();
  if(state.role==='inactive') return renderInactive();
  if(state.role==='manager') renderManager(); else renderVolunteer();
}

function renderLogin(){
  app.innerHTML=`<div class="login-shell"><div class="login-card">
    <div class="login-brand"><div class="login-logo"><i class="fa-solid fa-seedling"></i></div><h1>Casa do Oleiro</h1><p>Portal de gestão e planejamento do programa de voluntariado.</p></div>
    <div class="form-grid"><div class="field"><label>E-mail</label><input class="input" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input class="input" type="password" placeholder="••••••••"></div><button class="btn btn-primary btn-block" onclick="showToast('Login real será ligado ao backend após a validação das telas.')">Entrar</button></div>
    <div class="prototype-box"><strong>Modo protótipo</strong><p>Use os atalhos para validar cada experiência antes de conectarmos autenticação e banco.</p><div class="demo-actions" style="grid-template-columns:repeat(2,1fr)"><button onclick="setRole('manager')">Gestor</button><button onclick="setRole('volunteer','candidate')">Candidato</button><button onclick="setRole('volunteer','approved')">Voluntário</button><button onclick="setRole('inactive')">Perfil inativo</button></div></div>
  </div></div>`;
}


function renderInactive(){
  app.innerHTML=`<div class="login-shell"><div class="login-card"><div class="login-brand"><div class="login-logo"><i class="fa-solid fa-user-lock"></i></div><h1>Perfil temporariamente inativo</h1><p>Este acesso não está ativo no momento. Caso precise de mais informações, entre em contato com a equipe da Casa do Oleiro.</p></div><div class="notice"><i class="fa-solid fa-circle-info"></i><div>Suas informações permanecem registradas no histórico da Casa, mas o acesso ao portal está bloqueado.</div></div><button class="btn btn-outline btn-block" style="margin-top:14px" onclick="logout()">Voltar ao login</button></div></div>`;
}

function header(subtitle, showBell=false){
  return `<header class="app-header"><div class="brand-row"><div class="brand"><div class="brand-mark"><i class="fa-solid fa-seedling"></i></div><div class="brand-copy"><strong>Casa do Oleiro</strong><span>${subtitle}</span></div></div><div style="display:flex;gap:7px">${showBell?`<button class="icon-btn" onclick="openNotifications()"><i class="fa-regular fa-bell"></i></button>`:''}<button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid ${state.theme==='dark'?'fa-sun':'fa-moon'}"></i></button></div></div></header>`;
}
function managerNav(){
  const items=[['home','fa-house','Início'],['volunteer','fa-users','Voluntariado'],['agenda','fa-calendar-days','Agenda'],['groups','fa-people-group','Grupos'],['menu','fa-bars','Menu']];
  return `<nav class="bottom-nav">${items.map(([id,ic,tx])=>`<button class="nav-btn ${state.managerPage===id?'active':''}" onclick="state.managerPage='${id}';render()"><i class="fa-solid ${ic}"></i><span>${tx}</span></button>`).join('')}</nav>`;
}
function volunteerNav(){
  const approved=state.volunteerMode==='approved';
  const items=approved?[["home","fa-house","Início"],["plan","fa-calendar-plus","Planejamento"],["agenda","fa-calendar-check","Agenda"],["stay","fa-location-dot","Estadia"],["menu","fa-bars","Menu"]]:[["home","fa-house","Início"],["plan","fa-calendar-plus","Planejamento"],["stay","fa-location-dot","Estadia"],["info","fa-circle-info","Informações"],["menu","fa-bars","Menu"]];
  return `<nav class="bottom-nav">${items.map(([id,ic,tx])=>`<button class="nav-btn ${state.volunteerPage===id?'active':''}" onclick="state.volunteerPage='${id}';render()"><i class="fa-solid ${ic}"></i><span>${tx}</span></button>`).join('')}</nav>`;
}

function renderManager(){
  const pages={home:managerHome,volunteer:managerVolunteers,agenda:managerAgenda,groups:managerGroups,menu:managerMenu};
  app.innerHTML=header('Gestão de voluntariado • Rodeio',true)+`<main class="page">${pages[state.managerPage]()}</main>`+managerNav();
}

function managerHome(){
  return `<section class="hero"><div class="eyebrow" style="color:#d9eadf">Gestão • Rodeio</div><h1>Boa noite, Luan</h1><p class="muted">Veja o que precisa da sua atenção e o que acontece hoje na Casa.</p><div class="hero-actions"><button class="btn btn-light" onclick="openNewCandidate()"><i class="fa-solid fa-user-plus"></i>Novo candidato</button><button class="btn btn-outline" style="border-color:rgba(255,255,255,.28);color:white" onclick="state.managerPage='agenda';render()"><i class="fa-regular fa-calendar"></i>Ver agenda</button></div></section>
  <section class="section"><div class="section-head"><div><h2>Pendências</h2><p>Ações que merecem atenção</p></div></div><div class="grid-2 grid-md-4">
    ${metric('3','fa-clipboard-check','Em análise',"state.managerPage='volunteer';state.candidateTab='candidates';state.candidateFilter='analysis';render()")}
    ${metric('1','fa-rotate','Ajustes',"state.managerPage='volunteer';state.candidateTab='candidates';state.candidateFilter='adjustments';render()")}
    ${metric('2','fa-plane-arrival','Chegadas','showToast(\'Próximas chegadas abertas abaixo.\')')}
    ${metric('1','fa-triangle-exclamation','Alteração','openNotifications()')}
  </div></section>
  <section class="section"><div class="section-head"><div><h2>Hoje na Casa</h2><p>Segunda, 24 de agosto</p></div><button class="btn btn-soft" onclick="state.managerPage='agenda';render()">Agenda</button></div><div class="list">
    ${agendaItem('13:45','Yoga e alongamento','Sophie Martin','Grupo A + B','confirmed')}
    ${agendaItem('15:15','Conversação em inglês','Thomas Miller','Grupo C','change')}
    ${agendaItem('19:30','Oficina de música','Lucas García','Participação livre','confirmed')}
  </div></section>
  <section class="section"><div class="section-head"><div><h2>Próximas movimentações</h2><p>Chegadas e saídas</p></div></div><div class="grid-2">
    <div class="card"><span class="eyebrow">Chegadas</span><div style="margin-top:10px" class="list">${miniMove('Thomas Miller','27/08','em 3 dias')}${miniMove('Maria Gómez','30/08','em 6 dias')}</div></div>
    <div class="card"><span class="eyebrow">Saídas</span><div style="margin-top:10px" class="list">${miniMove('Sophie Martin','25/08','amanhã')}</div></div>
  </div></section>
  <section class="section"><div class="section-head"><div><h2>Na Casa agora</h2><p>2 voluntários</p></div></div><div class="list">${personCompact(state.candidates[3])}${personCompact(state.candidates[4])}</div></section>
  <section class="section"><div class="notice warning"><i class="fa-solid fa-triangle-exclamation"></i><div><strong>2 pontos precisam de atenção</strong><br>Existe uma sessão em conflito com a rotina e uma alteração feita por voluntário aguardando confirmação.</div></div></section>`;
}
function metric(n,icon,label,action){return `<button class="card metric" style="text-align:left;border:1px solid var(--border);color:var(--text)" onclick="${action}"><div class="metric-icon"><i class="fa-solid ${icon}"></i></div><div><strong>${n}</strong><span style="display:block">${label}</span></div></button>`}
function agendaItem(time,name,person,group,status){const [l,t]=statusMeta(status);return `<div class="list-item"><div class="time-box"><strong>${time}</strong><span>hoje</span></div><div class="item-main"><h3>${name}</h3><p>${person} • ${group}</p><div class="item-meta">${badge(l,t)}</div></div></div>`}
function miniMove(name,date,label){return `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><strong style="font-size:.7rem">${name}</strong><div style="font-size:.61rem;color:var(--muted)">${date} • ${label}</div></div>`}
function personCompact(p){const [l,t]=statusMeta(p.status);return `<div class="list-item clickable" onclick="openPerson(${p.id})"><div class="avatar">${p.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div class="item-main"><h3>${p.name}</h3><p>${p.country} • ${p.unit} • ${fmtDate(p.from,true)}–${fmtDate(p.to,true)}</p><div class="item-meta">${badge(l,t)}</div></div><i class="fa-solid fa-chevron-right" style="color:var(--muted);margin-top:11px"></i></div>`}

function managerVolunteers(){
  const topTabs=[['candidates','Candidatos'],['approved','Aprovados'],['rejected','Rejeitados']];
  let filtered=state.candidates;
  if(state.candidateTab==='candidates') filtered=filtered.filter(p=>['pending','analysis','adjustments'].includes(p.status));
  else filtered=filtered.filter(p=>p.status===state.candidateTab);
  if(state.candidateTab==='candidates'&&state.candidateFilter!=='all') filtered=filtered.filter(p=>p.status===state.candidateFilter);
  return `<section class="section"><div class="section-head"><div><span class="eyebrow">Gestão</span><h2>Voluntariado</h2><p>Candidatos e experiências da Casa</p></div><button class="btn btn-primary" onclick="openNewCandidate()"><i class="fa-solid fa-plus"></i>Novo</button></div>
    <div class="tabs">${topTabs.map(([id,l])=>`<button class="tab ${state.candidateTab===id?'active':''}" onclick="state.candidateTab='${id}';state.candidateFilter='all';render()">${l} ${countTab(id)}</button>`).join('')}</div>
    ${state.candidateTab==='candidates'?`<div class="tabs">${[['all','Todos'],['pending','Pendentes'],['analysis','Em análise'],['adjustments','Ajustes']].map(([id,l])=>`<button class="tab ${state.candidateFilter===id?'active':''}" onclick="state.candidateFilter='${id}';render()">${l}</button>`).join('')}</div>`:''}
    <div class="search-row"><input class="input" placeholder="Buscar nome, país ou e-mail"><button class="icon-btn"><i class="fa-solid fa-filter"></i></button></div>
    <div class="list">${filtered.length?filtered.map(personCompact).join(''):`<div class="empty"><i class="fa-regular fa-folder-open"></i>Nenhum perfil nesta seção.</div>`}</div>
  </section>`;
}
function countTab(id){if(id==='candidates')return state.candidates.filter(p=>['pending','analysis','adjustments'].includes(p.status)).length;return state.candidates.filter(p=>p.status===id).length}

function managerAgenda(){
  return `<section class="section"><div class="section-head"><div><span class="eyebrow">Rodeio</span><h2>Agenda da Casa</h2><p>Voluntariado + referências da rotina</p></div><button class="btn btn-primary" onclick="openQuickSession()"><i class="fa-solid fa-plus"></i>Atividade</button></div>
  ${dateStrip()}
  <div class="notice" style="margin:10px 0 14px"><i class="fa-solid fa-clock"></i><div><strong>Rotina-base é apenas referência.</strong><br>Atendimentos e atividades terapêuticas podem mudar a disponibilidade ao longo do dia.</div></div>
  ${renderDays(true)}</section>`;
}
function dateStrip(){const dates=['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11','2026-09-12'];return `<div class="calendar-strip">${dates.map(d=>`<button class="date-chip ${state.selectedDate===d?'active':''}" onclick="state.selectedDate='${d}';render()"><span>${dayName(d)}</span><strong>${new Date(d+'T12:00:00').getDate()}</strong><span>SET</span></button>`).join('')}</div>`}
function renderDays(manager=false){const dates=['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11'];return dates.map(d=>{const sessions=getSessions(d);return `<div class="day-block"><div class="day-title"><h3>${dayName(d)}, ${fmtDate(d)}</h3><span>${sessions.reduce((s,x)=>s+x.activity.duration,0)/60}h planejadas</span></div>${sessions.length?sessions.map(s=>sessionCard(s,manager)).join(''):`<div class="empty">Nenhuma atividade neste dia.</div>`}${manager?`<button class="btn btn-soft btn-block" style="margin-top:7px" onclick="openQuickSession('${d}')"><i class="fa-solid fa-plus"></i>Adicionar atividade</button>`:''}</div>`}).join('')}
function getSessions(date){const out=[];state.activities.forEach(a=>a.dates.forEach(d=>{if(d===date)out.push({activity:a,date:d,status:state.sessionStatus[`${a.id}-${d}`]||'proposed',group:state.sessionGroups[`${a.id}-${d}`]||'A definir'})}));return out.sort((a,b)=>a.activity.time.localeCompare(b.activity.time))}
function sessionCard(s,manager=false){const [l,t]=statusMeta(s.status);return `<div class="activity-card"><div class="activity-row"><div><h4>${s.activity.time} • ${s.activity.name}</h4><p>${s.activity.duration} min • ${s.activity.period} • ${s.activity.participation}</p></div>${badge(l,t)}</div><div class="item-meta">${badge(s.group,'primary')} ${s.activity.materials?badge('Materiais: '+s.activity.materials):''}</div>${manager?`<div class="activity-actions"><button class="btn btn-soft" onclick="confirmSession(${s.activity.id},'${s.date}')">Confirmar</button><button class="btn btn-outline" onclick="moveSession(${s.activity.id},'${s.date}')">Mover</button><button class="btn btn-outline" onclick="assignGroup(${s.activity.id},'${s.date}')">Grupo</button></div>`:''}</div>`}

function managerGroups(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Organização</span><h2>Grupos</h2><p>Identificação operacional dos grupos da comunidade</p></div></div><div class="notice"><i class="fa-solid fa-shield-heart"></i><div>O app de voluntariado trabalha com grupos e capacidade. Dados pessoais dos acolhidos ficam fora deste protótipo.</div></div><div class="grid-2" style="margin-top:12px">${state.groups.map(g=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="avatar">${g.id}</div>${badge(g.capacity+' participantes','primary')}</div><h3 style="font-size:.78rem;margin-top:12px">Grupo ${g.id}</h3><p style="font-size:.65rem;color:var(--muted)">${g.note}</p><button class="btn btn-outline btn-block" style="margin-top:12px" onclick="editGroup('${g.id}')">Editar</button></div>`).join('')}</div></section>`}
function managerMenu(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Gestão</span><h2>Menu</h2><p>Conteúdo e configurações</p></div></div><div class="menu-list">
  ${menuLink('fa-circle-info','Informações do portal','Conteúdo que candidatos e voluntários consultam',"openInfoEditor()")}
  ${menuLink('fa-building','Unidades','Rodeio ativa • Indaial preparada',"openUnits()")}
  ${menuLink('fa-user-shield','Gestores e acessos','Administradores e coordenadores',"openManagers()")}
  ${menuLink('fa-clock','Rotina-base','Horários de referência da comunidade',"openRoutine()")}
  ${menuLink('fa-user','Minha conta','Preferências e sessão',"showToast('Tela de conta entra na próxima etapa de backend.')")}
  ${menuLink('fa-right-from-bracket','Sair','Encerrar sessão neste dispositivo','logout()')}
  </div></section>`}
function menuLink(icon,title,desc,action){return `<button class="menu-link" onclick="${action}"><i class="fa-solid ${icon}"></i><span>${title}<small>${desc}</small></span><i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i></button>`}

function renderVolunteer(){
  const subtitle=state.volunteerMode==='candidate'?'Portal do candidato • Rodeio':'Portal do voluntário • Rodeio';
  const pages={home:volunteerHome,plan:volunteerPlan,agenda:volunteerAgenda,stay:volunteerStay,info:volunteerInfo,menu:volunteerMenu};
  app.innerHTML=header(subtitle,true)+`<main class="page">${pages[state.volunteerPage]()}</main>`+volunteerNav();
}
function volunteerHome(){const approved=state.volunteerMode==='approved';return `<section class="hero"><div class="eyebrow" style="color:#d9eadf">${approved?'Estadia confirmada':'Período proposto'}</div><h1>${approved?'Bem-vindo à sua experiência':'Prepare sua experiência'}</h1><p class="muted">Rodeio • 03 a 18 de setembro de 2026</p><div class="hero-actions">${approved?`<button class="btn btn-light" onclick="state.volunteerPage='agenda';render()"><i class="fa-regular fa-calendar-check"></i>Minha agenda</button>`:`<button class="btn btn-light" onclick="state.volunteerPage='plan';render()"><i class="fa-solid fa-calendar-plus"></i>Montar planejamento</button>`}</div></section>
  ${approved?`<section class="section"><div class="notice warning"><i class="fa-regular fa-bell"></i><div><strong>Seu cronograma foi atualizado</strong><br>Yoga foi movida para 11/09 às 13:45. <button class="btn btn-outline" style="margin-top:8px;min-height:30px;padding:5px 8px" onclick="showToast('Atualização marcada como lida.')">Entendi</button></div></div></section>`:''}
  <section class="section"><div class="section-head"><div><h2>${approved?'Próxima atividade':'Seu planejamento'}</h2><p>${approved?'O que vem a seguir':'Status da sua proposta'}</p></div></div>${approved?agendaItem('15:15','Conversação em inglês','Hoje','Grupo C','confirmed'):`<div class="card"><div class="status-line"><span class="dot warning"></span><strong style="font-size:.76rem">Planejamento pendente</strong></div><p style="font-size:.66rem;color:var(--muted);margin-top:7px">Adicione suas atividades nos dias da estadia e envie o planejamento para análise da equipe.</p><div class="stat-row"><span class="stat-pill">4 atividades</span><span class="stat-pill">8 sessões</span><span class="stat-pill">10h30</span></div></div>`}</section>
  <section class="section"><div class="section-head"><div><h2>Minha estadia</h2><p>Informações principais</p></div></div><div class="grid-2"><div class="card"><span class="eyebrow">Chegada</span><strong style="display:block;margin-top:8px;font-size:.85rem">03/09</strong><span style="font-size:.62rem;color:var(--muted)">Rodeio</span></div><div class="card"><span class="eyebrow">Saída</span><strong style="display:block;margin-top:8px;font-size:.85rem">18/09</strong><span style="font-size:.62rem;color:var(--muted)">Dia sem atividade</span></div></div></section>
  <section class="section"><div class="section-head"><div><h2>Informações importantes</h2><p>Tudo para sua chegada</p></div></div><div class="list"><button class="menu-link" onclick="state.volunteerPage='info';render()"><i class="fa-solid fa-route"></i><span>Como chegar<small>Transporte, endereço e horários</small></span><i class="fa-solid fa-chevron-right"></i></button><button class="menu-link" onclick="state.volunteerPage='info';render()"><i class="fa-solid fa-house"></i><span>Acomodação e refeições<small>O que está incluído na experiência</small></span><i class="fa-solid fa-chevron-right"></i></button></div></section>`}

function volunteerPlan(){
  return `<section class="section"><div class="section-head"><div><span class="eyebrow">03–18 SET</span><h2>Meu planejamento</h2><p>Datas e horários são sugestões até a confirmação da Casa</p></div><button class="btn btn-primary" onclick="openActivityModal()"><i class="fa-solid fa-plus"></i>Atividade</button></div>
  <div class="segment"><button class="${state.planView==='agenda'?'active':''}" onclick="state.planView='agenda';render()">Agenda</button><button class="${state.planView==='activities'?'active':''}" onclick="state.planView='activities';render()">Atividades</button></div>
  <div class="notice"><i class="fa-solid fa-circle-info"></i><div>Você pode editar o planejamento. Depois que uma sessão for confirmada, alterações feitas por você voltam para análise da Casa.</div></div>
  <div style="margin-top:14px">${state.planView==='agenda'?volunteerAgendaContent(true):activityList()}</div>
  <div class="card" style="margin-top:14px"><span class="eyebrow">Resumo</span><div class="stat-row"><span class="stat-pill">${state.activities.length} atividades</span><span class="stat-pill">${state.activities.reduce((s,a)=>s+a.dates.length,0)} sessões</span><span class="stat-pill">${(state.activities.reduce((s,a)=>s+a.duration*a.dates.length,0)/60).toFixed(1).replace('.',',')}h planejadas</span></div><button class="btn btn-primary btn-block" style="margin-top:12px" onclick="submitPlan()">Enviar planejamento</button></div></section>`;
}
function volunteerAgendaContent(editable=false){return `${dateStrip()}<div style="margin-top:14px">${['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11'].map(d=>{const ss=getSessions(d);return `<div class="day-block"><div class="day-title"><h3>${dayName(d)}, ${fmtDate(d)}</h3><span>${ss.reduce((x,s)=>x+s.activity.duration,0)/60}h</span></div>${ss.map(s=>sessionCardVolunteer(s,editable)).join('')||'<div class="empty">Nenhuma atividade planejada.</div>'}${editable?`<button class="btn btn-soft btn-block" style="margin-top:6px" onclick="openActivityModal('${d}')"><i class="fa-solid fa-plus"></i>Adicionar atividade</button>`:''}</div>`}).join('')}</div>`}
function sessionCardVolunteer(s,editable){const [l,t]=statusMeta(s.status);return `<div class="activity-card"><div class="activity-row"><div><h4>${s.activity.time} • ${s.activity.name}</h4><p>${s.activity.duration} min • ${s.activity.period}</p></div>${badge(l,t)}</div>${editable?`<div class="activity-actions"><button class="btn btn-outline" onclick="openActivityModal('${s.date}',${s.activity.id})">Editar</button><button class="btn btn-outline" onclick="moveSession(${s.activity.id},'${s.date}',true)">Mover</button></div>`:''}</div>`}
function activityList(){return `<div class="list">${state.activities.map(a=>`<div class="card"><div class="activity-row"><div><h3 style="font-size:.8rem">${a.name}</h3><p style="font-size:.65rem;color:var(--muted)">${a.description}</p></div>${badge(a.dates.length+' sessões','primary')}</div><div class="stat-row"><span class="stat-pill">${a.duration} min</span><span class="stat-pill">${a.participation}</span><span class="stat-pill">${a.period}</span></div><div style="font-size:.63rem;color:var(--muted);margin-top:10px">${a.dates.map(d=>fmtDate(d,true)).join(' • ')}</div><div class="activity-actions"><button class="btn btn-outline" onclick="openActivityModal(null,${a.id})">Editar atividade</button><button class="btn btn-soft" onclick="openReuseActivity(${a.id})">+ Sessão</button></div></div>`).join('')}</div>`}
function volunteerAgenda(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Estadia confirmada</span><h2>Minha agenda</h2><p>Cronograma operacional atualizado</p></div></div><div class="notice warning"><i class="fa-solid fa-rotate"></i><div>Uma alteração feita por você pode precisar de nova confirmação da equipe.</div></div><div style="margin-top:14px">${volunteerAgendaContent(true)}</div></section>`}
function volunteerStay(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Rodeio</span><h2>Minha estadia</h2><p>Informações do período</p></div></div><div class="grid-2"><div class="card"><span class="eyebrow">Chegada</span><strong style="display:block;margin-top:8px">03/09/2026</strong></div><div class="card"><span class="eyebrow">Saída</span><strong style="display:block;margin-top:8px">18/09/2026</strong></div></div><div class="card" style="margin-top:10px"><h3 style="font-size:.8rem">Unidade Rodeio</h3><p style="font-size:.67rem;color:var(--muted);margin-top:5px">Coordenador local disponível durante a experiência. Todas as atividades com a comunidade são acompanhadas pela equipe.</p><div class="activity-actions"><button class="btn btn-soft" onclick="showToast('Abriremos endereço e instruções de rota na versão final.')"><i class="fa-solid fa-route"></i>Como chegar</button><button class="btn btn-outline"><i class="fa-brands fa-whatsapp"></i>Contato</button></div></div></section>`}
function volunteerInfo(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Portal</span><h2>Informações da Casa</h2><p>Consulte antes e durante sua experiência</p></div></div>${infoAccordion()}</section>`}
function infoAccordion(){return `<div class="info-accordion"><details open><summary>Como chegar <i class="fa-solid fa-chevron-down"></i></summary><p>A unidade fica em Rodeio/SC. Antes da chegada, confirme com a equipe o melhor transporte e o horário previsto. Dependendo do horário pode haver possibilidade de apoio na chegada.</p></details><details><summary>Acomodação <i class="fa-solid fa-chevron-down"></i></summary><p>Homens utilizam quartos e banheiros compartilhados. Mulheres ficam em quarto e banheiro separados. Wi-Fi, cozinha e lavanderia estão disponíveis.</p></details><details><summary>Refeições <i class="fa-solid fa-chevron-down"></i></summary><p>Todas as refeições são oferecidas na unidade de Rodeio. Avise previamente caso possua alguma restrição alimentar importante.</p></details><details><summary>Rotina da comunidade <i class="fa-solid fa-chevron-down"></i></summary><p>A rotina começa às 06:00 e possui momentos de atividades práticas, reuniões, refeições e atividades noturnas. Ela é flexível devido aos atendimentos terapêuticos e profissionais.</p></details><details><summary>Princípios e religião <i class="fa-solid fa-chevron-down"></i></summary><p>A Casa possui princípios cristãos e momentos de oração. O voluntário não precisa ser cristão nem participar das atividades religiosas.</p></details><details><summary>Convivência e segurança <i class="fa-solid fa-chevron-down"></i></summary><p>Álcool, drogas e cigarros são proibidos. Fotos e vídeos dos acolhidos exigem autorização prévia. Voluntários não exercem funções clínicas, medicamentosas ou terapêuticas.</p></details></div>`}
function volunteerMenu(){return `<section class="section"><div class="section-head"><div><span class="eyebrow">Portal</span><h2>Menu</h2><p>Conta e informações</p></div></div><div class="menu-list">${menuLink('fa-circle-info','Informações da Casa','Orientações da experiência',"state.volunteerPage='info';render()")}${menuLink('fa-user','Minha conta','Dados básicos do acesso',"showToast('Perfil básico entra com o backend.')")}${menuLink('fa-arrows-rotate','Trocar modo do protótipo','Alternar candidato / aprovado',"state.volunteerMode=state.volunteerMode==='candidate'?'approved':'candidate';localStorage.setItem('oleiro-volunteer-mode',state.volunteerMode);render()")}${menuLink('fa-right-from-bracket','Sair','Encerrar sessão','logout()')}</div></section>`}

function openModal(title,subtitle,body,footer=''){
  modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>${body}${footer}</div></div>`;
}
function closeModal(){modalRoot.innerHTML=''}
function openNotifications(){openModal('Atualizações','Mudanças e pendências recentes',`<div class="list">${state.notifications.map(n=>`<div class="list-item"><div class="metric-icon"><i class="fa-regular fa-bell"></i></div><div class="item-main"><h3>${n.title}</h3><p>${n.text}</p></div></div>`).join('')}</div>`)}
function openNewCandidate(){openModal('Novo candidato','Cadastre somente quem já está no processo real de avaliação.',`<div class="form-grid"><div class="field"><label>Nome</label><input id="ncName" class="input" placeholder="Nome completo"></div><div class="field"><label>E-mail</label><input id="ncEmail" class="input" type="email" placeholder="email@exemplo.com"></div><div class="field-row"><div class="field"><label>WhatsApp</label><input id="ncPhone" class="input" placeholder="+55 ..."></div><div class="field"><label>Nacionalidade</label><input id="ncCountry" class="input" placeholder="País"></div></div><div class="field"><label>Unidade</label><select id="ncUnit" class="select"><option>Rodeio</option><option>Indaial</option></select></div><div class="field-row"><div class="field"><label>Chegada proposta</label><input id="ncFrom" class="input" type="date"></div><div class="field"><label>Saída proposta</label><input id="ncTo" class="input" type="date"></div></div><div class="field"><label>Observação interna</label><textarea id="ncNote" class="textarea" placeholder="Opcional"></textarea></div><button class="btn btn-primary btn-block" onclick="saveCandidate()">Cadastrar e liberar acesso</button></div>`)}
function saveCandidate(){const name=document.getElementById('ncName').value.trim();const email=document.getElementById('ncEmail').value.trim();if(!name||!email)return showToast('Informe nome e e-mail.');state.candidates.unshift({id:Date.now(),name,country:document.getElementById('ncCountry').value||'—',email,phone:document.getElementById('ncPhone').value,unit:document.getElementById('ncUnit').value,from:document.getElementById('ncFrom').value||'2026-09-01',to:document.getElementById('ncTo').value||'2026-09-15',status:'pending',sessions:0,activities:0,submitted:'—'});closeModal();state.managerPage='volunteer';state.candidateTab='candidates';state.candidateFilter='pending';render();showToast('Candidato cadastrado no protótipo.')}
function openPerson(id){const p=state.candidates.find(x=>x.id===id);if(!p)return;const [l,t]=statusMeta(p.status);openModal(p.name,`${p.country} • ${p.unit}`,`<div class="tabs"><button class="tab active">Visão geral</button><button class="tab">Planejamento</button><button class="tab">Estadia</button><button class="tab">Histórico</button></div><div class="card"><div class="activity-row"><div><span class="eyebrow">Status</span><h3 style="font-size:.88rem;margin-top:5px">${l}</h3></div>${badge(l,t)}</div><div class="stat-row"><span class="stat-pill">${fmtDate(p.from,true)}–${fmtDate(p.to,true)}</span><span class="stat-pill">${p.activities} atividades</span><span class="stat-pill">${p.sessions} sessões</span></div></div><div class="card" style="margin-top:10px"><h3 style="font-size:.78rem">Contato</h3><p style="font-size:.66rem;color:var(--muted);margin-top:6px">${p.email}<br>${p.phone}</p></div>${p.status==='analysis'||p.status==='adjustments'?`<div class="activity-actions" style="margin-top:12px"><button class="btn btn-primary" onclick="approveCandidate(${p.id})">Aprovar</button><button class="btn btn-outline" onclick="requestAdjust(${p.id})">Pedir ajuste</button><button class="btn btn-danger" onclick="rejectCandidate(${p.id})">Recusar</button></div>`:''}${p.status==='rejected'?`<button class="btn btn-soft btn-block" style="margin-top:12px" onclick="reactivateCandidate(${p.id})">Reativar perfil</button>`:''}`)}
function approveCandidate(id){const p=state.candidates.find(x=>x.id===id);p.status='approved';closeModal();render();showToast('Candidato aprovado. Estadia confirmada.')}
function requestAdjust(id){const p=state.candidates.find(x=>x.id===id);p.status='adjustments';closeModal();render();showToast('Planejamento devolvido para ajustes.')}
function rejectCandidate(id){const p=state.candidates.find(x=>x.id===id);p.status='rejected';closeModal();state.candidateTab='rejected';render();showToast('Perfil movido para Rejeitados e inativado.')}
function reactivateCandidate(id){const p=state.candidates.find(x=>x.id===id);p.status='pending';closeModal();state.candidateTab='candidates';state.candidateFilter='pending';render();showToast('Perfil reativado.')}
function openActivityModal(date=null,id=null){const a=id?state.activities.find(x=>x.id===id):null;const defaultDate=date||'2026-09-08';openModal(a?'Editar atividade':'Nova atividade',a?'A descrição é compartilhada entre todas as sessões.':'Cadastre uma vez e selecione quantas datas precisar.',`<div class="form-grid"><div class="field"><label>Nome da atividade</label><input id="actName" class="input" value="${a?a.name:''}" placeholder="Ex.: Conversação em inglês"></div><div class="field"><label>Descrição</label><textarea id="actDesc" class="textarea" placeholder="Como a atividade funciona?">${a?a.description:''}</textarea></div><div class="field-row"><div class="field"><label>Duração</label><select id="actDuration" class="select">${[30,60,90,120].map(v=>`<option value="${v}" ${a&&a.duration===v?'selected':''}>${v===90?'1h30':v===120?'2h':v+' min'}</option>`).join('')}</select></div><div class="field"><label>Participação</label><select id="actParticipation" class="select">${['Até 5','Até 10','Livre','Outro'].map(v=>`<option ${a&&a.participation===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Materiais necessários</label><input id="actMaterials" class="input" value="${a?a.materials:''}" placeholder="Nenhum, quadro, bola..."></div><div class="field"><label>Observações</label><textarea id="actNotes" class="textarea" placeholder="Opcional">${a?a.notes:''}</textarea></div><div class="field-row"><div class="field"><label>Período preferido</label><select id="actPeriod" class="select">${['Manhã','Tarde','Noite','Sem preferência'].map(v=>`<option ${a&&a.period===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Horário sugerido</label><input id="actTime" class="input" type="time" value="${a?a.time:'15:15'}"><small>Opcional na versão final.</small></div></div><div class="field"><label>Datas em que deseja realizar</label><div class="check-grid">${['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11','2026-09-14','2026-09-15','2026-09-16'].map(d=>`<label class="check-card"><input type="checkbox" name="actDate" value="${d}" ${(a&&a.dates.includes(d))||(!a&&d===defaultDate)?'checked':''}>${dayName(d)} ${fmtDate(d,true)}</label>`).join('')}</div></div><button class="btn btn-primary btn-block" onclick="saveActivity(${a?a.id:'null'})">${a?'Salvar alterações':'Adicionar atividade'}</button></div>`)}
function saveActivity(id){const dates=[...document.querySelectorAll('input[name="actDate"]:checked')].map(x=>x.value);const data={name:document.getElementById('actName').value.trim(),description:document.getElementById('actDesc').value.trim(),duration:+document.getElementById('actDuration').value,participation:document.getElementById('actParticipation').value,materials:document.getElementById('actMaterials').value.trim()||'Nenhum',notes:document.getElementById('actNotes').value.trim(),period:document.getElementById('actPeriod').value,time:document.getElementById('actTime').value||'15:15',dates};if(!data.name)return showToast('Informe o nome da atividade.');if(id){Object.assign(state.activities.find(x=>x.id===id),data)}else{state.activities.push({id:Date.now(),...data})}closeModal();render();showToast(id?'Atividade atualizada.':'Atividade adicionada ao planejamento.')}
function openReuseActivity(id){const a=state.activities.find(x=>x.id===id);openModal('Adicionar sessão',a.name,`<div class="field"><label>Selecione uma nova data</label><select id="reuseDate" class="select">${['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11','2026-09-14','2026-09-15','2026-09-16'].filter(d=>!a.dates.includes(d)).map(d=>`<option value="${d}">${dayName(d)} • ${fmtDate(d)}</option>`).join('')}</select></div><button class="btn btn-primary btn-block" style="margin-top:12px" onclick="addReuseDate(${id})">Adicionar sessão</button>`)}
function addReuseDate(id){const a=state.activities.find(x=>x.id===id);const d=document.getElementById('reuseDate').value;a.dates.push(d);state.sessionStatus[`${id}-${d}`]='proposed';closeModal();render();showToast('Nova sessão adicionada.')}
function submitPlan(){showToast('Planejamento enviado para análise.');if(state.volunteerMode==='candidate')state.notifications.unshift({id:Date.now(),title:'Planejamento enviado',text:'A equipe da Casa recebeu seu planejamento.',unread:true})}
function confirmSession(id,date){state.sessionStatus[`${id}-${date}`]='confirmed';render();showToast('Sessão confirmada.')}
function moveSession(id,date,byVolunteer=false){const a=state.activities.find(x=>x.id===id);openModal('Mover sessão',`${a.name} • ${fmtDate(date)}`,`<div class="field"><label>Nova data</label><select id="moveDate" class="select">${['2026-09-07','2026-09-08','2026-09-09','2026-09-10','2026-09-11','2026-09-14','2026-09-15','2026-09-16'].filter(d=>d!==date).map(d=>`<option value="${d}">${dayName(d)} • ${fmtDate(d)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Novo horário sugerido</label><input id="moveTime" class="input" type="time" value="${a.time}"></div><button class="btn btn-primary btn-block" style="margin-top:12px" onclick="saveMove(${id},'${date}',${byVolunteer})">Mover</button>`)}
function saveMove(id,oldDate,byVolunteer){const a=state.activities.find(x=>x.id===id);const newDate=document.getElementById('moveDate').value;a.dates=a.dates.map(d=>d===oldDate?newDate:d);a.time=document.getElementById('moveTime').value||a.time;delete state.sessionStatus[`${id}-${oldDate}`];state.sessionStatus[`${id}-${newDate}`]=byVolunteer?'change':'confirmed';closeModal();render();showToast(byVolunteer?'Alteração enviada para confirmação.':'Cronograma atualizado.')}
function assignGroup(id,date){openModal('Definir grupo','Somente a equipe da Casa define quem participa.',`<div class="check-grid">${['A','B','C','D','A+B','C+D','Livre'].map(g=>`<button class="check-card" onclick="saveGroup(${id},'${date}','${g}')">${g==='Livre'?'Participação livre':'Grupo '+g}</button>`).join('')}</div>`)}
function saveGroup(id,date,g){state.sessionGroups[`${id}-${date}`]=g;closeModal();render();showToast('Grupo atualizado.')}
function openQuickSession(date='2026-09-08'){openActivityModal(date)}
function editGroup(id){const g=state.groups.find(x=>x.id===id);openModal('Editar Grupo '+id,'Configuração operacional',`<div class="form-grid"><div class="field"><label>Capacidade de referência</label><input id="gCap" class="input" type="number" value="${g.capacity}"></div><div class="field"><label>Observação</label><input id="gNote" class="input" value="${g.note}"></div><button class="btn btn-primary" onclick="saveGroupConfig('${id}')">Salvar</button></div>`)}
function saveGroupConfig(id){const g=state.groups.find(x=>x.id===id);g.capacity=+document.getElementById('gCap').value||g.capacity;g.note=document.getElementById('gNote').value;closeModal();render();showToast('Grupo atualizado.')}
function openInfoEditor(){openModal('Informações do portal','Conteúdo visível para candidatos e voluntários.',`${infoAccordion()}<button class="btn btn-primary btn-block" onclick="showToast('Na versão com banco, cada bloco será editável pelo gestor.')">Editar conteúdo</button>`)}
function openUnits(){openModal('Unidades','Estrutura preparada para expansão.',`<div class="list"><div class="list-item"><div class="metric-icon"><i class="fa-solid fa-house"></i></div><div class="item-main"><h3>Rodeio</h3><p>Unidade ativa</p><div class="item-meta">${badge('Ativa','success')}</div></div></div><div class="list-item"><div class="metric-icon"><i class="fa-solid fa-house"></i></div><div class="item-main"><h3>Indaial</h3><p>Preparada para ativação futura</p><div class="item-meta">${badge('Inativa')}</div></div></div></div>`)}
function openManagers(){openModal('Gestores e acessos','MVP com mesmo nível de permissão.',`<div class="list"><div class="list-item"><div class="avatar">LF</div><div class="item-main"><h3>Luan Fernande</h3><p>Administrador principal</p></div>${badge('Gestor','success')}</div><div class="list-item"><div class="avatar">CO</div><div class="item-main"><h3>Coordenador Rodeio</h3><p>Acesso completo no MVP</p></div>${badge('Gestor','success')}</div></div>`)}
function openRoutine(){openModal('Rotina-base','Referência para o planejamento. Não bloqueia horários automaticamente.',`<div class="list">${[['06:00','Despertar e higiene'],['06:15–07:30','Devocional'],['07:30–08:15','Café'],['08:15–11:15','Atividades práticas'],['11:15–12:00','Reunião de sentimentos'],['12:00–13:30','Almoço e descanso'],['13:45–15:00','Atividades'],['15:00–15:15','Café da tarde'],['15:15–16:30','Atividades'],['19:30–21:00','Filme, palestra ou outras atividades'],['21:30','Silêncio total']].map(([t,n])=>`<div class="list-item"><div class="time-box"><strong>${t}</strong></div><div class="item-main"><h3>${n}</h3></div></div>`).join('')}</div>`)}

window.state=state;Object.assign(window,{render,setRole,logout,toggleTheme,showToast,openNotifications,openNewCandidate,saveCandidate,openPerson,approveCandidate,requestAdjust,rejectCandidate,reactivateCandidate,openActivityModal,saveActivity,openReuseActivity,addReuseDate,submitPlan,confirmSession,moveSession,saveMove,assignGroup,saveGroup,openQuickSession,editGroup,saveGroupConfig,openInfoEditor,openUnits,openManagers,openRoutine,closeModal});
render();
</script>
</body></html>
